  --meeting-bg:#EFE5FF; --meeting-fg:#5B2BB5;
  --proposal-bg:#FFEBD6; --proposal-fg:#8A4200;

  --bad-bg:#FDE3E1; --bad-fg:#A3261B;
  --neutral-bg:#ECEAE3; --neutral-fg:#4A4D55;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:20px 16px 110px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--muted);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-size:30px;line-height:1.1;font-weight:700;text-wrap:balance}
h2.sec{margin:0;font-size:12px;letter-spacing:.1em;font-weight:600;color:var(--muted);text-transform:uppercase}
.sub{font-size:14px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
button.card{width:100%;text-align:left;display:flex}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.tap{display:flex;gap:12px;text-decoration:none;color:inherit;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tap:hover{border-color:var(--line-strong)}
.ico{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.pill{flex-shrink:0;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.b{font-weight:600}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.75}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad-fg);color:var(--surface);border-color:var(--bad-fg)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:14px;border-radius:3px;background:var(--faint)}
.dots i.on{background:var(--ink)}
.steps{display:flex;gap:3px}
.steps i{width:18px;height:6px;border-radius:999px;background:var(--faint)}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--proposal-bg);color:var(--proposal-fg)}
.banner.err{background:var(--bad-bg);color:var(--bad-fg)}
.banner.info{background:var(--sunk);color:var(--ink-2)}
.skel{background:var(--sunk);border-radius:8px;height:12px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){.skel,.spin{animation:none}}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;position:relative}
nav.tabs button .pad{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] .pad{background:var(--accent-soft);color:var(--accent-fg)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad-fg);color:var(--surface);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:none;background:none;font-size:15px;font-weight:500;padding:0 4px;margin-left:-6px;color:var(--ink)}
.stagebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stagebar i{height:6px;border-radius:999px;background:var(--faint)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px}
.timeline .rail{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.timeline .dot{width:12px;height:12px;margin-top:4px;border-radius:999px;border:2px solid var(--ground)}
.timeline .line{flex:1;width:2px;background:var(--faint)}
.timeline .txt{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;min-width:0}
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:94%;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{display:flex;justify-content:center;padding-top:8px}
.sheet .grab i{width:40px;height:5px;border-radius:999px;background:var(--line-strong)}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px}
.sheet .bd{overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:12px}
.sheet .ft{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
textarea.draft{width:100%;min-height:260px;padding:14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);font-size:15px;line-height:1.5;resize:vertical}
input.field,select.field,textarea.field{width:100%;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);font-size:15px}
textarea.field{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.quote{padding:10px 12px;background:var(--sunk);border-radius:12px;font-size:13px;color:var(--ink-2)}
.kv{display:flex;gap:8px;padding:8px 0;font-size:13px}
.kv span:first-child{width:60px;flex-shrink:0;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.check{width:22px;height:22px;margin:2px 0 0;flex-shrink:0;accent-color:var(--accent)}
.fit{width:42px;height:42px;border-radius:999px;border:3px solid var(--faint);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600}
.actionbar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:4;padding:0 12px}
.actionbar .in{max-width:496px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.actionbar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--inv);color:var(--inv-ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:var(--sunk);border-radius:12px}
.seg button{height:38px;border:none;border-radius:9px;background:transparent;font-weight:600;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
</style>

<div class="app" id="app">

<script>
(function(){
'use strict';

/* ---------- configuration: the same facts the Claude outreach agents use ---------- */
const CFG = {
  me: 'ijas@cybersquare.ca',
  reviewers: ['ijas@cybersquare.ca','ijasali.m@gmail.com'],
  pipelineFolder: '1dcIjjYqmkfPpJPE4ESe5zqytcevKkDGW',
  pipelineTitle: 'Cyber Square — Claude Pipeline',
  tomSheet: '1GGX7scCtUWqno1aNQZnnVl0q8R0mo9I51fnaabnpZ7Q',
  tz: 'America/Toronto',
  gmail: 'Gmail',
  drive: 'Google Drive',
  handManagedDomains: ['caasda.com','senecahill.ca','iitacademy.ca','brackendalemontessori.com','innovaacademy.ca','cambridgeinternationalacademy.ca','cciaedu.com','afzalacademy@gmail.com','pickeringcs.on.ca','immanuelschool.ca','ama4kids.com','nbcla.ca','brightstartacademy.info','faithway.org'],
  freeMail: ['gmail.com','yahoo.com','yahoo.ca','hotmail.com','outlook.com','live.com','icloud.com','bellnet.ca','rogers.com','sympatico.ca'],
  dncWords: ['do not continue','not interested','unsubscribe','remove','already offer','passed','too young','declined']
};

const STAGES = {
  'Replied':   {label:'Replied', key:'replied', step:1},
  'Meeting':   {label:'Meeting', key:'meeting', step:2},
  'Proposal':  {label:'Proposal sent', key:'proposal', step:3},
  'Closed Won':{label:'Won', key:'won', step:4},
  'Closed Lost':{label:'Closed lost', key:'neutral', step:0},
  'Do-Not-Contact':{label:'Do not contact', key:'bad', step:0}
};
const ACTIVE = ['Replied','Meeting','Proposal','Closed Won'];

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const lsGet = (k, d) => { try { const v = localStorage.getItem('cs.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('cs.'+k, JSON.stringify(v)); } catch(e){} };
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  pipe:'<path d="M4 4h4v16H4z"/><path d="M10 4h4v11h-4z"/><path d="M16 4h4v6h-4z"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  reply:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  chev:'<path d="m9 6 6 6-6 6"/>', back:'<path d="m15 6-6 6 6 6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  alert:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
};
const svg = (n, s=20, w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* dates, all in Toronto time like the agents */
function tzParts(d){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:CFG.tz,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(d);
  const o = {}; p.forEach(x => o[x.type] = x.value); return o;
}
function ymd(d){ const o = tzParts(d); return `${o.year}-${o.month}-${o.day}`; }
const TODAY = ymd(new Date());
function weekStart(){
  const o = tzParts(new Date()); const idx = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(o.weekday);
  const d = new Date(Date.UTC(+o.year, +o.month-1, +o.day - idx)); return d.toISOString().slice(0,10);
}
const WEEK0 = weekStart();
function addDays(s, n){ const d = new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const WEEK1 = addDays(WEEK0, 6);
function toDate(v){ if(!v) return null; const d = new Date(v); return isNaN(d) ? null : d; }
function fmtDay(v){ const d = typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+'T12:00:00Z') : toDate(v); if(!d) return '—';
  const opt = {timeZone: typeof v==='string' && v.length===10 ? 'UTC' : CFG.tz, day:'numeric', month:'short'}; return d.toLocaleDateString('en-GB', opt); }
function fmtTime(v){ const d = toDate(v); return d ? d.toLocaleTimeString('en-US',{timeZone:CFG.tz,hour:'numeric',minute:'2-digit'}) : ''; }
function rel(v){ const d = toDate(v); if(!d) return ''; const day = ymd(d); if(day === TODAY) return 'today ' + fmtTime(d);
  const diff = Math.round((new Date(TODAY) - new Date(day)) / 864e5); if(diff === 1) return 'yesterday'; if(diff < 7) return diff + ' days ago'; return fmtDay(d); }
function daysSince(v){ const d = toDate(v); if(!d) return 999; return Math.round((new Date(TODAY) - new Date(ymd(d))) / 864e5); }

/* ---------- state ---------- */
const S = {
  tab: lsGet('tab','today'),
  mcp:null, sample:null, db:null, ready:false, noRuntime:false,
  sheet: lsGet('sheet', null),        // {id, modifiedTime, rows}
  tom: lsGet('tom', null),            // {modifiedTime, prospects, hot, rejected}
  threads: lsGet('threads', {}),      // leadKey -> {messages, fetchedAt}
  review: lsGet('review', null),
  week: lsGet('week', null),
  actions: [],
  err: {}, busy: {},
  pipeFilter:'all', bankRegion:'all', bankSel:new Set(), weekTab:'batch',
  decisions: {}, confirmDecision:false,
  lead:null, composer:null, modal:null
};

/* ---------- connector calls ---------- */
const ERR_COPY = {
  needs_reauth: s => `Reconnect ${s} in claude.ai Settings → Connectors, then tap Refresh.`,
  server_not_connected: s => `Add the ${s} connector in claude.ai Settings → Connectors, then tap Refresh.`,
  selection_required: s => `Choose which ${s} account this page should use, then tap Refresh.`,
  not_in_manifest: s => `${s} is switched off for this page. Allow it from the page's permissions to see this section.`,
  blocked_by_policy: s => `Your organization blocks this ${s} action.`,
  approval_required: s => `This ${s} action needs approval from your organization.`,
  not_granted: () => `Connectors are not available in this view. Open the tracker inside Claude.`,
  capability_disabled: () => `Connectors are not available in this view. Open the tracker inside Claude.`
};
function errText(e, server){
  const c = e && e.code; const s = (e && e.server) || server || 'the connector';
  if(ERR_COPY[c]) return ERR_COPY[c](s);
  if(c === 'tool_error') return `${s} said: ${e.message || 'the request failed'}.`;
  if(c === 'server_unavailable' || c === 'upstream_error') return `Couldn't reach ${s} just now. Tap Refresh to try again.`;
  return (e && e.message) ? e.message : `Something went wrong talking to ${s}.`;
}
async function call(server, tool, input, retry){
  try {
    const r = await S.mcp.callTool(server, tool, input, {cache:false});
    return r.payload !== undefined ? r.payload : r;
  } catch(e){
    const readOnly = !['reply','send_message','create_draft'].includes(tool);
    if(retry !== false && readOnly && e && e.retryable){
      await new Promise(r => setTimeout(r, (e.retryAfterMs || 1500) + Math.random()*800));
      return call(server, tool, input, false);
    }
    throw e;
  }
}

function b64ToText(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u); }
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(x => x !== '')).map(r => { const o = {}; head.forEach((h,i) => o[h] = (r[i] || '').trim()); return o; });
}

function pick(o, names){ for(const n of names){ for(const k in o){ if(k.trim().toLowerCase() === n) return String(o[k]||'').trim(); } } return ''; }
function tomRow(r){
  const first = pick(r,['first name']), last = pick(r,['last name']);

function region(city){ const c = norm(city);
  if(['whitby','oshawa','ajax','pickering','bowmanville','courtice'].some(x => c.includes(x))) return 'GTA-East';
  if(['markham','newmarket'].some(x => c.includes(x))) return 'GTA-North';

function emailType(e){ const l = String(e).split('@')[0]; return ['info','admin','office','principal','contact','reception','general','hello'].includes(l) ? 'generic' : 'direct'; }
function isHandManaged(email){ const e = String(email).toLowerCase(); return CFG.handManagedDomains.some(d => d.includes('@') ? e === d : e.endsWith('@'+d) || e.endsWith('.'+d)); }
function threadIdsFrom(text){ const out = []; String(text||'').replace(/thread\s+([0-9a-f]{12,20})/gi, (m, id) => { out.push(id); return m; }); return out; }

function leads(){
  const rows = (S.sheet && S.sheet.rows) || [];
  const map = new Map();
  rows.forEach(r => {
    if(!ACTIVE.includes(r.status)) return;
    map.set(r.lead_id, { key:r.lead_id, id:r.lead_id, school:r.school, contact:r.contact_name, first:(r.contact_name||'').split(' ')[0], role:r.contact_role,
      email:(r.email||'').toLowerCase(), city:r.city, region:r.region, status:r.status, next:r.next_action_date, replySummary:r.reply_summary,
      notes:r.notes, lastSubject:r.last_subject, touches:[r.touch1_date,r.touch2_date,r.touch3_date].filter(Boolean),
      threadIds: threadIdsFrom(r.notes + ' ' + r.reply_summary), source: r.added_by === 'Claude' ? 'Claude' : 'Pipeline sheet' });
  });
  const known = new Set([...map.values()].flatMap(l => [l.email, norm(l.school)]));
  (S.tom ? S.tom.hot : []).map(tomRow).forEach(t => {
    if(!t.school || known.has(t.email) || known.has(norm(t.school))) return;
    const key = 'tom-' + norm(t.school);
    map.set(key, { key, id:'', school:t.school, contact:t.contact, first:t.first, role:'', email:t.email, city:t.city, region:region(t.city),
      status: /won|signed|client/i.test(t.status) ? 'Closed Won' : t.proposal ? 'Proposal' : t.demo ? 'Meeting' : 'Replied',
      next:'', replySummary:'', notes:t.notes, lastSubject:'', touches:[], threadIds:threadIdsFrom(t.notes), source:"Tom's Hot Leads" });
  });
  // app actions Claude has not applied yet override what the sheet says
  pendingActions().forEach(a => { const l = map.get(a.leadKey); if(l && a.type === 'set_status' && a.status) { l.status = a.status; if(a.next) l.next = a.next; } });
  return [...map.values()].map(decorate).sort(byUrgency);
}
function decorate(l){
  const t = S.threads[l.key]; const st = t ? threadStats(t.messages, l) : null;
  l.stats = st;
  const noteHead = (l.notes||'').match(/^(NEEDS IJAS|OVERDUE PROMISE|OVERDUE|DUE NOW)[:\s-]*([^.]*)/i);
  let next = '', tone = 'ok', rank = 5;
  if(st && st.waiting){ next = 'Reply now'; tone = 'bad'; rank = 0; }
  else if(noteHead && !(st && st.lastFrom === 'us' && st.lastDays < 3)){ next = cap(noteHead[2] || noteHead[1]); tone = 'bad'; rank = 1; }
  else if(l.next && l.next <= TODAY){ next = l.next < TODAY ? 'Overdue · ' + fmtDay(l.next) : 'Due today'; tone = 'bad'; rank = 2; }
  else if(st && st.lastFrom === 'us' && st.lastDays >= 7 && l.status !== 'Closed Won'){ next = `Follow up · quiet ${st.lastDays} days`; tone = 'warn'; rank = 3; }
  else if(l.next){ next = fmtDay(l.next); rank = 4; }
  else next = l.status === 'Closed Won' ? 'Client' : '—';
  l.nextLabel = next; l.tone = tone; l.rank = l.status === 'Closed Won' && rank > 1 ? 9 : rank;
  return l;
}
const cap = s => { s = String(s||'').trim(); return s.charAt(0).toUpperCase() + s.slice(1); };
function byUrgency(a, b){ return a.rank - b.rank || String((b.stats||{}).lastDate||'').localeCompare(String((a.stats||{}).lastDate||'')); }

function isMine(sender){ const s = String(sender||'').toLowerCase(); return s.includes('@cybersquare.ca') || s.includes('ijasali.m@gmail.com'); }
function isBounce(sender){ return /mailer-daemon|postmaster/i.test(String(sender||'')); }
function threadStats(msgs, l){
  const m = (msgs||[]).filter(x => !isBounce(x.sender)).slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
  if(!m.length) return null;
  const firstIn = m.findIndex(x => !isMine(x.sender));
  const ours = m.filter(x => isMine(x.sender)).length;
  const followups = firstIn < 0 ? 0 : m.slice(firstIn).filter(x => isMine(x.sender)).length;
  const inbound = m.filter(x => !isMine(x.sender)).length;
  const last = m[m.length-1];
  const lastIn = [...m].reverse().find(x => !isMine(x.sender));
  return { ours, followups, inbound, lastDate:last.date, lastFrom: isMine(last.sender) ? 'us' : 'them', lastDays: daysSince(last.date),
    waiting: !isMine(last.sender), lastIn, last, messages:m };
}

async function loadReview(){

      const msgs = (t.messages||[]).slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
      const rv = msgs.find(m => /^(REVIEW|PRE-APPROVED) for/i.test(m.subject||'')) || msgs[0];
      const later = msgs.filter(m => m.date > rv.date && CFG.reviewers.some(r => String(m.sender||'').toLowerCase().includes(r)));
      const decision = later.length ? firstLine(later[later.length-1].plaintextBody || later[later.length-1].snippet) : '';
      S.review = parseReview(rv.plaintextBody || '', rv.subject || '');
      Object.assign(S.review, {threadId:t.id, messageId:rv.id, date:rv.date, url:t.viewUrl, decision, decisionDate: later.length ? later[later.length-1].date : ''});
      if(!S.decisions._for || S.decisions._for !== rv.id){ S.decisions = {_for:rv.id}; S.review.items.forEach(it => S.decisions[it.n] = S.review.pre ? 'ok' : ''); }
    }

  } catch(e){ S.err.review = errText(e, CFG.gmail); }
  S.busy.review = false; render();

function firstLine(s){ return String(s||'').split('\n').map(x => x.trim()).find(x => x && !/^>/.test(x)) || ''; }
function parseReview(body, subject){
  const r = {subject, pre:/^PRE-APPROVED/i.test(subject), items:[], replies:'', pipelineLine:''};
  const when = subject.match(/for\s+([^:]+?):/i); r.forDate = when ? when[1].trim() : '';
  const lines = body.replace(/\r/g,'').split('\n');
  let cur = null, mode = '';
  const head = /^\s*#(\d+)\s+[—–-]+\s+(.+?)\s+[—–-]+\s+(.*?)\s*<([^>\s]+)>\s+[—–-]+\s+(.+?)\s+[—–-]+\s+DRAFT ID\s*([\w-]+)/i;
  for(const raw of lines){
    const line = raw.trimEnd(); const m = line.match(head);
    if(m){ cur = {n:+m[1], school:m[2], contact:m[3], email:m[4], touch:m[5], draftId:m[6], context:'', subj:'', body:[]}; r.items.push(cur); mode = 'item'; continue; }
    if(/^\s*REPLIES\s*[—–-]/i.test(line)){ cur = null; mode = 'replies'; continue; }
    if(/^\s*SKIPPED\s*[—–-]/i.test(line)){ cur = null; mode = 'skip'; continue; }
    if(/^\s*PIPELINE:/i.test(line)){ r.pipelineLine = line.trim(); cur = null; mode = ''; continue; }
    if(mode === 'replies'){ r.replies += line + '\n'; continue; }
    if(!cur) continue;
    if(/^\s*CONTEXT:/i.test(line)){ cur.context = line.replace(/^\s*CONTEXT:\s*/i,''); continue; }
    if(/^\s*SUBJECT:/i.test(line)){ cur.subj = line.replace(/^\s*SUBJECT:\s*/i,''); continue; }
    if(/^\s*-{3,}\s*$/.test(line)){ cur = null; continue; }
    cur.body.push(line);
  }
  r.items.forEach(it => it.body = it.body.join('\n').trim());
  return r;
}

/* ---------- Claude drafting ---------- */
function stripQuoted(t){
  const out = []; for(const line of String(t||'').replace(/\r/g,'').split('\n')){
    if(/^On .+wrote:\s*$/.test(line.trim()) || /^-{2,}\s*Original Message/i.test(line.trim())) break;
    if(/^\s*>/.test(line)) continue; out.push(line); }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function openComposer(l){
  const st = l.stats; const last = st && st.last;
  const c = S.composer = {lead:l, versions:[], idx:-1, loading:true, streaming:false, hint:'', ask:'', to:'', subject:'', lastIn: st && st.lastIn, lastMsgId: last && last.id};
  const lastIn = st && st.lastIn;
  c.to = lastIn && !isBounce(lastIn.sender) ? String(lastIn.sender).replace(/^.*<([^>]+)>.*$/,'$1') : l.email;
  c.subject = last ? 'Re: ' + String(last.subject||'').replace(/^(re:\s*)+/i,'') : '';
  render();
  try {
    if(last){ const t = await gm('get_thread', {threadId:last.threadId, messageFormat:'PLAIN_TEXT'});
      const ms = (t.messages||[]).slice().sort((a,b) => String(a.date).localeCompare(String(b.date))).slice(-8);
      c.thread = ms.map(m => `From: ${isMine(m.sender) ? 'Ijas (us)' : m.sender}\nDate: ${fmtDay(m.date)}\nSubject: ${m.subject}\n\n${stripQuoted(m.plaintextBody || m.snippet).slice(0,3500)}`).join('\n\n-----\n\n');
      const lm = ms[ms.length-1]; if(lm){ c.lastMsgId = lm.id; }
    } else c.thread = '(No earlier emails found.)';
  } catch(e){ c.thread = (st ? st.messages.slice(-6).map(m => `From: ${isMine(m.sender) ? 'Ijas (us)' : m.sender} · ${fmtDay(m.date)}\n${m.snippet}`).join('\n\n') : ''); c.error = errText(e, CFG.gmail) + ' Drafting from the preview text instead.'; }
  c.loading = false; render();
  if(!S.sample){ c.error = 'Claude drafting is not available in this view. You can still write and send the reply yourself.'; c.versions.push({text:''}); c.idx = 0; render(); return; }
  draft(false);
}
function draftPrompt(c){
  const l = c.lead; const extra = [c.hint, (c.ask||'').trim()].filter(Boolean).join('. ');
  const prev = c.versions.length ? c.versions[c.idx].text : '';
  return `You are drafting an email for Ijasali Manalody, co-founder of Cyber Square. Cyber Square runs hands-on coding and robotics programs in schools: our trainer comes to the school, runs every session during the school day or after school, and manages the students, so teachers have nothing to prepare.

Write the next email in this conversation with ${l.contact || 'the school'} at ${l.school}.

Rules:
- Plain text only. No markdown, no subject line, no signature block other than the sign-off below.
- Start with "Hi ${l.first || 'there'},".
- If they asked something in their last message, answer it directly first. If we sent the last message, write a short, friendly follow-up that gives them a reason to reply.
- Keep it under 140 words. End with one clear next step, usually a 15 minute call.
- Never offer free trials. Never say where Cyber Square is based.
- Only mention prices if our earlier emails or the notes below already gave them; otherwise offer to give an exact number on a call.
- Do not invent facts, clients, numbers or dates that are not in the thread or notes.
- Follow any guidance in the notes (for example "offer teacher-training option").
- End with exactly:
Ijasali Manalody
Co-founder, Cyber Square

Pipeline notes kept by Claude's outreach agent:
Stage: ${l.status}
${l.replySummary ? 'Reply summary: ' + l.replySummary + '\n' : ''}${l.notes ? 'Notes: ' + l.notes + '\n' : ''}
Conversation, oldest first:
${c.thread || '(none)'}
${prev && extra ? `\nThe previous draft was:\n${prev}\n` : ''}${extra ? `\nChange requested by Ijas: ${extra}\n` : ''}
Reply with only the email text.`;
}
async function draft(regen){
  const c = S.composer; if(!c || !S.sample) return;
  c.streaming = true; c.error = ''; c.confirm = false;
  const v = {text:''}; c.versions.push(v); c.idx = c.versions.length - 1; render();
  const ta = () => document.getElementById('cmp-body');
  try {
    const res = await S.sample(draftPrompt(c), {cache: regen ? false : {gcTime:600000}, onText: ({text}) => { v.text = text; const t = ta(); if(t) t.value = text; }});
    v.text = res.text.trim();
    if(res.truncated) c.error = 'The draft was cut short. Tap Regenerate or ask for a shorter reply.';
  } catch(e){
    if(e && e.text) v.text = e.text;
    const map = {not_granted:'You declined Claude drafting for this page. You can still write the reply yourself.', sampling_disabled:'Claude drafting is not available for this account.',
      rate_limited:'You have hit your Claude usage limit for now. Try again later or write the reply yourself.', refused:'Claude could not draft this one. Try a different instruction.',
      cancelled:'', session_expired:'Sign in to Claude again, then tap Regenerate.'};
    c.error = map[e && e.code] !== undefined ? map[e.code] : 'Claude could not finish the draft. Tap Regenerate to try again.';
    if(!v.text){ c.versions.pop(); c.idx = c.versions.length - 1; if(c.idx < 0){ c.versions.push({text:''}); c.idx = 0; } }
  }
  c.streaming = false; render();
}
async function sendReply(asDraft){
  const c = S.composer; const l = c.lead; const body = (document.getElementById('cmp-body') || {}).value || '';
  if(!body.trim()){ c.error = 'Write something first.'; return render(); }
  if(!c.to){ c.error = 'No email address for this school.'; return render(); }
  if(!asDraft && !c.confirm){ c.confirm = true; return render(); }
  c.busy = true; c.error = ''; render();
  try {
    if(asDraft) await gm('create_draft', Object.assign({to:[c.to], subject:c.subject || `Cyber Square · ${l.school}`, body}, c.lastMsgId ? {replyToMessageId:c.lastMsgId} : {}));
    else if(c.lastMsgId) await gm('reply', {messageId:c.lastMsgId, to:[c.to], body});
    else await gm('send_message', {to:[c.to], subject:`Coding and robotics at ${l.school}`, body});
    await logAction({type: asDraft ? 'reply_drafted' : 'reply_sent', leadKey:l.key, leadId:l.id||'', school:l.school});
    S.composer = null; toast(asDraft ? 'Saved to Gmail drafts' : `Sent to ${c.to}`);
    if(!asDraft){ S.busy.lead = true; render(); try { await loadThread(l); } catch(e){} S.busy.lead = false; }
    render();
  } catch(e){ c.busy = false; c.confirm = false; c.error = (asDraft ? 'Not saved. ' : 'Not sent. ') + errText(e, CFG.gmail) + (asDraft ? '' : ' Check Gmail’s Sent folder before trying again.'); render(); }
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el || el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' && el.type !== 'checkbox') return;
  const act = el.dataset.act, k = el.dataset.k;
  switch(act){
    case 'tab': S.tab = k; S.lead = null; lsSet('tab', k); render(); window.scrollTo(0,0); break;
    case 'refresh': refreshAll(); break;
    case 'pfilter': S.pipeFilter = k; render(); break;
    case 'region': S.bankRegion = k; render(); break;
    case 'wtab': S.weekTab = k; render(); break;
    case 'lead': S.lead = k; render(); window.scrollTo(0,0); { const l = leads().find(x => x.key === k); if(l && !S.threads[k]){ S.busy.lead = true; render(); try { await loadThread(l); } catch(e){} S.busy.lead = false; render(); } } break;
    case 'back': S.lead = null; render(); break;
    case 'reloadlead': { const l = leads().find(x => x.key === S.lead); if(!l) break; S.busy.lead = true; render(); try { await loadThread(l); } catch(e){ toast(errText(e, CFG.gmail)); } S.busy.lead = false; render(); } break;
    case 'compose': { const l = leads().find(x => x.key === S.lead); if(l) openComposer(l); } break;
    case 'closeov': S.composer = null; S.modal = null; render(); break;
    case 'ver': { const c = S.composer; c.idx = Math.max(0, Math.min(c.versions.length-1, c.idx + (+k))); c.confirm = false; render(); } break;
    case 'hint': { const c = S.composer; c.hint = c.hint === k ? '' : k; render(); } break;
    case 'regen': { const c = S.composer; c.ask = (document.getElementById('cmp-ask')||{}).value || ''; draft(true); } break;
    case 'sendreply': sendReply(false); break;
    case 'savedraft': sendReply(true); break;
    case 'stage': case 'note': { const l = leads().find(x => x.key === S.lead); if(l){ S.modal = {kind:act, lead:l}; render(); } } break;
    case 'savemodal': {
      const m = S.modal; const note = ($('#md-note')||{}).value || ''; const status = m.kind === 'stage' ? $('#md-status').value : ''; const next = m.kind === 'stage' ? $('#md-next').value : '';
      if(m.kind === 'note' && !note.trim()) return;
      m.busy = true; render();
      try { await tellClaude(m.kind === 'stage' ? 'set_status' : 'add_note', m.lead, {status, next_action_date: next && next !== m.lead.next ? next : '', note});
        S.modal = null; toast('Saved. Claude applies it at 8 pm.'); }
      catch(e){ m.busy = false; toast('Not saved. ' + errText(e, CFG.gmail)); }
      render(); } break;
    case 'dec': { if(S.decisions[k] === el.dataset.v) S.decisions[k] = S.review.pre ? 'ok' : ''; else S.decisions[k] = el.dataset.v; S.confirmDecision = false; render(); } break;
    case 'decide': {
      if(!S.confirmDecision){ S.confirmDecision = true; render(); break; }
      const txt = decisionText(); const rv = S.review; if(!txt){ S.confirmDecision = false; render(); break; }
      S.busy.decide = true; render();
      try { await gm('reply', {messageId:rv.messageId, to:[CFG.me], body:txt + '\n\n(sent from the CS Tracker app)'}); await logAction({type:'batch_decision', decision:txt, reviewId:rv.messageId});
        rv.decision = txt; rv.decisionDate = new Date().toISOString(); lsSet('review', rv); toast('Sent to the morning sender: ' + txt); }
      catch(e){ toast('Not sent. ' + errText(e, CFG.gmail)); }
      S.busy.decide = false; S.confirmDecision = false; render(); } break;
    case 'bsel': { S.bankSel.has(k) ? S.bankSel.delete(k) : S.bankSel.add(k); render(); } break;
    case 'prioritize': {
      const items = bank().filter(b => S.bankSel.has(b.key)); if(!items.length) break;
      S.busy.prio = true; render();
      try {
        const body = ['Instruction for the Cyber Square evening agent, sent from the CS Tracker app by Ijas.', '', 'request_id: app-' + Date.now().toString(36), 'action: prioritize',
          'Draft these schools first in the next batch (all other rules and caps still apply):', ...items.map(b => `- ${b.school} <${b.email}> (lead_id: ${b.key.startsWith('tom-') ? 'not imported yet' : b.key})`)].join('\n');
        await gm('send_message', {to:[CFG.me], subject:`[CS Tracker] Send first: ${items.length} school${items.length>1?'s':''}`, body});
        await logAction({type:'prioritize', keys:items.map(b => b.key), schools:items.map(b => b.school)});
        S.bankSel.clear(); toast('Claude will draft these first tonight');
      } catch(e){ toast('Not sent. ' + errText(e, CFG.gmail)); }
      S.busy.prio = false; render(); } break;
  }
});
document.addEventListener('input', ev => {
  if(ev.target.id === 'cmp-body' && S.composer){ const v = S.composer.versions[S.composer.idx]; if(v){ v.text = ev.target.value; v.edited = true; } S.composer.confirm = false; }
  if(ev.target.id === 'cmp-ask' && S.composer) S.composer.ask = ev.target.value;
});
document.addEventListener('change', ev => { const el = ev.target; if(el.dataset && el.dataset.act === 'bsel'){ /* handled on click */ } });
document.addEventListener('submit', ev => ev.preventDefault());
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && (S.composer || S.modal)){ S.composer = null; S.modal = null; render(); } });

/* ---------- boot ---------- */
async function refreshAll(){
  if(!S.mcp) return;
  await Promise.allSettled([loadSheets().then(loadAllThreads), loadReview(), loadWeek()]);
}
async function boot(){
  render();
  if(!window.claude || !window.claude.use){ S.noRuntime = true; return render(); }
  const [mcp, sample, db] = await Promise.all(['mcp','sample','db'].map(n => window.claude.use(n).catch(() => null)));
  S.mcp = mcp; S.sample = sample; S.db = db;
  if(!mcp){ S.noRuntime = true; return render(); }
  watchActions();
  render();
  refreshAll();
}
boot();
})();
</script>
