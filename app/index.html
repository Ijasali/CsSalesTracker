<title>Cyber Square Pipeline</title>
<meta name="description" content="Mobile sales tracker for Cyber Square's school outreach, backed by the Cyber Square Supabase database the Claude agents use.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F2EC; --surface:#FFFFFF; --sunk:#ECE9E1; --line:#E4E1D8; --line-strong:#D9D5CA;
  --ink:#17191F; --ink-2:#3A3D45; --muted:#5B5F68; --faint:#DDD9CF;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E3ECFF; --accent-fg:#1D46B8;
  --inv:#17191F; --inv-ink:#FFFFFF; --inv-2:#2A2D35; --inv-muted:#C9CBD1;
  --replied-bg:#E3ECFF; --replied-fg:#1D46B8;
  --meeting-bg:#EFE5FF; --meeting-fg:#5B2BB5;
  --proposal-bg:#FFEBD6; --proposal-fg:#8A4200;
  --won-bg:#DDF3E6; --won-fg:#17663A;
  --bad-bg:#FDE3E1; --bad-fg:#A3261B;
  --neutral-bg:#ECEAE3; --neutral-fg:#4A4D55;
  --claude:#B4532A; --claude-soft:#F7E6DD;
  --scrim:rgba(23,25,31,.55);
  --display:'Bricolage Grotesque',Georgia,serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121317; --surface:#1B1D23; --sunk:#23262D; --line:#2C2F37; --line-strong:#3A3E47;
    --ink:#EEEDEA; --ink-2:#CFCFD2; --muted:#A1A4AD; --faint:#3A3E47;
    --accent:#7FA2FF; --accent-ink:#0E1426; --accent-soft:#1E2A4A; --accent-fg:#A9C0FF;
    --inv:#EEEDEA; --inv-ink:#17191F; --inv-2:#D9D7D1; --inv-muted:#4A4D55;
    --replied-bg:#1E2A4A; --replied-fg:#A9C0FF;
    --meeting-bg:#2D2146; --meeting-fg:#CDB5FF;
    --proposal-bg:#3A2A17; --proposal-fg:#FFC58A;
    --won-bg:#16301F; --won-fg:#8FDBAE;
    --bad-bg:#3D1C1A; --bad-fg:#FF9E94;
    --neutral-bg:#2A2C33; --neutral-fg:#C9CBD1;
    --claude:#F0A27E; --claude-soft:#3A241B;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121317; --surface:#1B1D23; --sunk:#23262D; --line:#2C2F37; --line-strong:#3A3E47;
  --ink:#EEEDEA; --ink-2:#CFCFD2; --muted:#A1A4AD; --faint:#3A3E47;
  --accent:#7FA2FF; --accent-ink:#0E1426; --accent-soft:#1E2A4A; --accent-fg:#A9C0FF;
  --inv:#EEEDEA; --inv-ink:#17191F; --inv-2:#D9D7D1; --inv-muted:#4A4D55;
  --replied-bg:#1E2A4A; --replied-fg:#A9C0FF;
  --meeting-bg:#2D2146; --meeting-fg:#CDB5FF;
  --proposal-bg:#3A2A17; --proposal-fg:#FFC58A;
  --won-bg:#16301F; --won-fg:#8FDBAE;
  --bad-bg:#3D1C1A; --bad-fg:#FF9E94;
  --neutral-bg:#2A2C33; --neutral-fg:#C9CBD1;
  --claude:#F0A27E; --claude-soft:#3A241B;
  --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:20px 16px 110px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--muted);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-size:30px;line-height:1.1;font-weight:700;text-wrap:balance}
h2.sec{margin:0;font-size:12px;letter-spacing:.1em;font-weight:600;color:var(--muted);text-transform:uppercase}
.sub{font-size:14px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
button.card{width:100%;text-align:left;display:flex}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.tap{display:flex;gap:12px;text-decoration:none;color:inherit;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tap:hover{border-color:var(--line-strong)}
.ico{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.pill{flex-shrink:0;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.b{font-weight:600}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.75}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad-fg);color:var(--surface);border-color:var(--bad-fg)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:14px;border-radius:3px;background:var(--faint)}
.dots i.on{background:var(--ink)}
.steps{display:flex;gap:3px}
.steps i{width:18px;height:6px;border-radius:999px;background:var(--faint)}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--proposal-bg);color:var(--proposal-fg)}
.banner.err{background:var(--bad-bg);color:var(--bad-fg)}
.banner.info{background:var(--sunk);color:var(--ink-2)}
.skel{background:var(--sunk);border-radius:8px;height:12px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){.skel,.spin{animation:none}}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;position:relative}
nav.tabs button .pad{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] .pad{background:var(--accent-soft);color:var(--accent-fg)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad-fg);color:var(--surface);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:none;background:none;font-size:15px;font-weight:500;padding:0 4px;margin-left:-6px;color:var(--ink)}
.stagebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stagebar i{height:6px;border-radius:999px;background:var(--faint)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px}
.timeline .rail{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.timeline .dot{width:12px;height:12px;margin-top:4px;border-radius:999px;border:2px solid var(--ground)}
.timeline .line{flex:1;width:2px;background:var(--faint)}
.timeline .txt{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;min-width:0}
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:94%;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{display:flex;justify-content:center;padding-top:8px}
.sheet .grab i{width:40px;height:5px;border-radius:999px;background:var(--line-strong)}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px}
.sheet .bd{overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:12px}
.sheet .ft{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
textarea.draft{width:100%;min-height:260px;padding:14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);font-size:15px;line-height:1.5;resize:vertical}
input.field,select.field,textarea.field{width:100%;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);font-size:15px}
textarea.field{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.quote{padding:10px 12px;background:var(--sunk);border-radius:12px;font-size:13px;color:var(--ink-2)}
.kv{display:flex;gap:8px;padding:8px 0;font-size:13px}
.kv span:first-child{width:60px;flex-shrink:0;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.check{width:22px;height:22px;margin:2px 0 0;flex-shrink:0;accent-color:var(--accent)}
.fit{width:42px;height:42px;border-radius:999px;border:3px solid var(--faint);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600}
.actionbar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:4;padding:0 12px}
.actionbar .in{max-width:496px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.actionbar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--inv);color:var(--inv-ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:var(--sunk);border-radius:12px}
.seg button{height:38px;border:none;border-radius:9px;background:transparent;font-weight:600;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
</style>

<div class="app" id="app">
  <main id="view" aria-live="polite"></main>
  <div id="actionbar"></div>
  <nav class="tabs" aria-label="Main"><div class="in" id="tabs"></div></nav>
  <div id="overlay"></div>
  <div id="toast" role="status"></div>
</div>

<script>
(function(){
'use strict';

/* ---------- configuration: the same facts the Claude outreach agents use ---------- */
const CFG = {
  me: 'ijas@cybersquare.ca',
  reviewers: ['ijas@cybersquare.ca','ijasali.m@gmail.com'],
  project: 'abylyjqplyxrpexwyufi',
  tz: 'America/Toronto',
  gmail: 'Gmail',
  supabase: 'Supabase'
};

/* stages exactly as the database stores them */
const STAGES = {
  engaged:        {label:'Replied',        key:'replied',  step:1},
  meeting_booked: {label:'Meeting',        key:'meeting',  step:2},
  proposal_sent:  {label:'Proposal sent',  key:'proposal', step:3},
  client:         {label:'Client',         key:'won',      step:4},
  closed_lost:    {label:'Closed lost',    key:'neutral',  step:0},
  do_not_contact: {label:'Do not contact', key:'bad',      step:0},
  cold_contacted: {label:'Cold contacted', key:'neutral',  step:0},
  not_contacted:  {label:'Not contacted',  key:'neutral',  step:0},
  bounced:        {label:'Bounced',        key:'bad',      step:0},
  no_email:       {label:'No email',       key:'neutral',  step:0}
};
const HOT = ['engaged','meeting_booked','proposal_sent','client'];

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lit = v => v == null || v === '' ? 'null' : "'" + String(v).replace(/'/g, "''") + "'";
const lsGet = (k, d) => { try { const v = localStorage.getItem('cs2.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('cs2.'+k, JSON.stringify(v)); } catch(e){} };
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  pipe:'<path d="M4 4h4v16H4z"/><path d="M10 4h4v11h-4z"/><path d="M16 4h4v6h-4z"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  reply:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  chev:'<path d="m9 6 6 6-6 6"/>', back:'<path d="m15 6-6 6 6 6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  alert:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
};
const svg = (n, s=20, w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* dates, in Toronto time like the agents */
function tzParts(d){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:CFG.tz,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(d);
  const o = {}; p.forEach(x => o[x.type] = x.value); return o;
}
function ymd(d){ const o = tzParts(d); return `${o.year}-${o.month}-${o.day}`; }
const TODAY = ymd(new Date());
function addDays(s, n){ const d = new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const WEEK0 = (() => { const o = tzParts(new Date()); return addDays(TODAY, -['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(o.weekday)); })();
const WEEK1 = addDays(WEEK0, 6);
function toDate(v){ if(!v) return null; const d = new Date(v); return isNaN(d) ? null : d; }
function isDay(v){ return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }
function fmtDay(v){ const d = isDay(v) ? new Date(v+'T12:00:00Z') : toDate(v); if(!d) return '—';
  return d.toLocaleDateString('en-GB', {timeZone: isDay(v) ? 'UTC' : CFG.tz, day:'numeric', month:'short'}); }
function fmtTime(v){ const d = toDate(v); return d ? d.toLocaleTimeString('en-US',{timeZone:CFG.tz,hour:'numeric',minute:'2-digit'}) : ''; }
function dayOf(v){ return isDay(v) ? v : (toDate(v) ? ymd(toDate(v)) : ''); }
function daysSince(v){ const d = dayOf(v); if(!d) return 999; return Math.round((new Date(TODAY) - new Date(d)) / 864e5); }
function rel(v){ const d = dayOf(v); if(!d) return ''; if(d === TODAY) return isDay(v) ? 'today' : 'today ' + fmtTime(v);
  const n = daysSince(v); if(n === 1) return 'yesterday'; if(n > 1 && n < 7) return n + ' days ago'; return fmtDay(v); }

/* ---------- state ---------- */
const S = {
  tab: lsGet('tab','today'),
  mcp:null, sample:null, noRuntime:false,
  schools: lsGet('schools', null),   // pipeline schools (replied at least once)
  stats: lsGet('stats', null),       // stage counts, sync info, agent runs
  batch: lsGet('batch', null),       // planned_actions for the next send day
  review: lsGet('review', null),     // the review email in Gmail (for Approve / Hold)
  week: lsGet('week', null),
  bank: lsGet('bank', null),
  detail: {},                        // school id -> {timeline, contacts, msgs}
  gmailNew: {},                      // school id -> newest Gmail message not yet synced
  err: {}, busy: {},
  pipeFilter:'all', bankRegion:'all', bankSel:new Set(), weekTab:'next', sched: lsGet('sched', null), extra:{}, openDays:new Set(),
  decisions:{}, confirmDecision:false, confirmBank:'',
  lead:null, composer:null, modal:null
};

/* ---------- connector calls ---------- */
const ERR_COPY = {
  needs_reauth: s => `Reconnect ${s} in claude.ai Settings → Connectors, then tap Refresh.`,
  server_not_connected: s => `Add the ${s} connector in claude.ai Settings → Connectors, then tap Refresh.`,
  selection_required: s => `Choose which ${s} account this page should use, then tap Refresh.`,
  not_in_manifest: s => `${s} is switched off for this page. Allow it from the page's permissions to see this section.`,
  blocked_by_policy: s => `Your organization blocks this ${s} action.`,
  approval_required: s => `This ${s} action needs approval from your organization.`,
  not_granted: () => `Connectors are not available in this view. Open the tracker inside Claude.`,
  capability_disabled: () => `Connectors are not available in this view. Open the tracker inside Claude.`
};
function errText(e, server){
  const c = e && e.code; const s = (e && e.server) || server || 'the connector';
  if(ERR_COPY[c]) return ERR_COPY[c](s);
  if(c === 'tool_error') return `${s} said: ${e.message || 'the request failed'}.`;
  if(c === 'server_unavailable' || c === 'upstream_error') return `Couldn't reach ${s} just now. Tap Refresh to try again.`;
  return (e && e.message) ? e.message : `Something went wrong talking to ${s}.`;
}
const WRITES = ['reply','send_message','create_draft'];
async function call(server, tool, input, retry){
  try {
    const r = await S.mcp.callTool(server, tool, input, {cache:false});
    return r.payload !== undefined ? r.payload : r;
  } catch(e){
    if(retry !== false && !WRITES.includes(tool) && e && e.retryable){
      await new Promise(r => setTimeout(r, (e.retryAfterMs || 1500) + Math.random()*800));
      return call(server, tool, input, false);
    }
    throw e;
  }
}
const gm = (tool, input) => call(CFG.gmail, tool, input);

/* Supabase: execute_sql wraps rows in an untrusted-data block; pull the JSON array out */
function rowsFrom(p){
  if(Array.isArray(p)) return p;
  let t = typeof p === 'string' ? p : (p && (p.result || p.text)) || '';
  if(typeof t !== 'string') return Array.isArray(t) ? t : [];
  const m = t.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  const body = m ? m[1] : t;
  const i = body.indexOf('['); const j = body.lastIndexOf(']');
  if(i < 0 || j < i) return [];
  return JSON.parse(body.slice(i, j + 1));
}
async function sql(query, write){
  const p = await call(CFG.supabase, 'execute_sql', {project_id: CFG.project, query}, write ? false : undefined);
  const t = typeof p === 'string' ? p : (p && p.result) || '';
  if(typeof t === 'string' && /^\s*(ERROR|error)[:\s]/.test(t)) throw {code:'tool_error', server:CFG.supabase, message:t.slice(0,300)};
  return rowsFrom(p);
}

/* Gmail is synced into the database each evening. To catch replies that arrived since,
   look at the inbox after the last sync and flag schools whose contacts wrote. */
async function checkGmailSinceSync(){
  const since = S.stats && S.stats.synced; if(!since || !S.schools) return;
  const d = toDate(since); if(!d) return;
  const after = ymd(new Date(d.getTime() - 864e5)).replace(/-/g,'/');
  try {
    const res = await gm('search_threads', {query:`in:inbox after:${after} -from:${CFG.me}`, pageSize:40, view:'THREAD_VIEW_MINIMAL'});
    const byMail = {}, byDom = {};
    S.schools.forEach(s => s.contacts.forEach(c => { const e = String(c.email||'').toLowerCase(); if(!e) return; byMail[e] = s.id; const dom = e.split('@')[1]; if(dom && !/gmail|yahoo|hotmail|outlook|live\.|icloud|bellnet|rogers|sympatico/.test(dom)) byDom[dom] = s.id; }));
    const found = {};
    ((res && res.threads) || []).forEach(t => (t.messages||[]).forEach(m => {
      const from = String(m.sender||'').toLowerCase().replace(/^.*<([^>]+)>.*$/,'$1');
      if(/mailer-daemon|postmaster/.test(from)) return;
      const id = byMail[from] || byDom[from.split('@')[1]]; if(!id) return;
      if(!(m.date > since)) return;
      if(!found[id] || m.date > found[id].date) found[id] = {id:m.id, thread:m.threadId || t.id, at:m.date, from, subject:m.subject, text:decodeEntities(m.snippet||'')};
    }));
    S.gmailNew = found; render();
  } catch(e){ /* the database view still works without this check */ }
}

async function loadReview(){
  try {
    const res = await gm('search_threads', {query:`from:${CFG.me} (subject:"REVIEW for" OR subject:"PRE-APPROVED for") newer_than:3d`, pageSize:5});
    const th = (res && res.threads) || [];

    else {
      const t = await gm('get_thread', {threadId:th[0].id, messageFormat:'PLAIN_TEXT'});
      const msgs = (t.messages||[]).slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
      const rv = msgs.find(m => /^(REVIEW|PRE-APPROVED) for/i.test(m.subject||'')) || msgs[0];
      const later = msgs.filter(m => m.date > rv.date && CFG.reviewers.some(r => String(m.sender||'').toLowerCase().includes(r)));
      const last = later[later.length-1];
      S.review = {subject:rv.subject, pre:/^PRE-APPROVED/i.test(rv.subject||''), messageId:rv.id, date:rv.date, url:t.viewUrl,
        decision: last ? firstLine(last.plaintextBody || last.snippet) : '', decisionDate: last ? last.date : ''};
    }
    delete S.err.review; lsSet('review', S.review);
  } catch(e){ S.err.review = errText(e, CFG.gmail); }
  resetDecisions(); render();
}

function decorate(l){
  const nw = S.gmailNew[l.id];
  const lastIn = nw && (!l.lastIn || nw.at > l.lastIn.at) ? Object.assign({unsynced:true}, nw) : l.lastIn;
  const lastAt = [l.lastMsg && l.lastMsg.at, nw && nw.at].filter(Boolean).sort().pop();
  const waiting = !!(nw && (!l.lastMsg || nw.at > l.lastMsg.at)) || !!(l.lastMsg && l.lastMsg.dir === 'inbound');
  const lastDays = daysSince(lastAt);
  let next = '', tone = 'ok', rank = 5;
  if(waiting && l.stage !== 'client'){ next = 'Reply now'; tone = 'bad'; rank = 0; }
  else if(l.next && l.next <= TODAY){ next = (l.next < TODAY ? 'Overdue · ' : 'Today · ') + (l.nextAction || fmtDay(l.next)); tone = 'bad'; rank = l.next < TODAY ? 1 : 2; }
  else if(!waiting && lastDays >= 7 && lastDays < 999 && !['client','closed_lost'].includes(l.stage) && !l.next){ next = `Follow up · quiet ${lastDays} days`; tone = 'warn'; rank = 3; }
  else if(l.next){ next = fmtDay(l.next) + (l.nextAction ? ' · ' + l.nextAction : ''); rank = 4; }
  else next = l.nextAction || (l.stage === 'client' ? 'Client' : '—');
  return Object.assign({}, l, {lastIn, waiting, lastAt, lastDays, nextLabel:next, tone, rank: l.stage === 'client' && rank > 1 ? 9 : rank});
}

/* ---------- Sync: Gmail → Supabase, the same steps as the evening agent's Step 1 and 2 ---------- */
const FREE = /(^|\.)(gmail|googlemail|yahoo|hotmail|outlook|live|aol|ymail|icloud|me|bellnet|rogers|sympatico|msn|protonmail)\./;
function addr(s){ const m = String(s||'').match(/<([^>]+)>/); return (m ? m[1] : String(s||'')).trim().toLowerCase(); }
function isUs(e){ e = addr(e); return e.endsWith('@cybersquare.ca') || e === 'ijasali.m@gmail.com'; }
function direction(m){
  const from = addr(m.sender), subj = String(m.subject||''), text = subj + ' ' + String(m.snippet||'') + ' ' + String(m.plaintextBody||'').slice(0,600);
  if(isUs(from)){
    const rc = [...(m.toRecipients||[]), ...(m.ccRecipients||[])].map(addr).filter(Boolean);
    return rc.length && rc.every(isUs) ? 'internal' : 'outbound';
  }
  if(/mailer-daemon|postmaster/.test(from) || /delivery status notification|undeliverable|mail delivery failed|returned mail|failure notice|delivery has failed/i.test(subj))
    return /delay|temporar|will retry|will be retried|not yet been delivered/i.test(text) ? 'bounce_temporary' : 'bounce';
  if(/^(accepted|declined|tentatively accepted|invitation|updated invitation|canceled event|cancelled event)\b/i.test(subj)) return 'calendar';
  if(/out of (the )?office|automatic reply|auto[- ]?reply|autoreply|away from (the|my) office|thank you for contacting|thanks for contacting|we (have )?received your (message|email)|this is an automated/i.test(text)) return 'autoreply';
  return 'inbound';
}
async function syncGmail(){
  if(S.sync && S.sync.running) return;
  const started = new Date().toISOString();
  S.sync = {running:true, step:'Checking when Gmail was last synced…'}; render();
  let runId = null;
  try {
    const st = await sql(`select value from sync_state where key = 'gmail_synced_through'`);
    const since = toDate(st[0] && st[0].value) || new Date(Date.now() - 3*864e5);
    const after = Math.floor((since.getTime() - 864e5) / 1000);
    try { const r = await sql(`insert into agent_runs (agent) values ('app_sync') returning id`, true); runId = r[0] && r[0].id; } catch(e){}
    // 1. every thread with activity since the last sync (minus a day, as the agent does)
    S.sync.step = 'Looking for new emails in Gmail…'; render();
    const ids = []; let token = '';
    for(let page = 0; page < 10; page++){
      const res = await gm('search_threads', Object.assign({query:`after:${after} -category:promotions -category:social -category:forums`, pageSize:50, view:'THREAD_VIEW_METADATA_ONLY'}, token ? {pageToken:token} : {}));
      ((res && res.threads) || []).forEach(t => ids.push(t.id));
      token = res && (res.nextPageToken || res.next_page_token); if(!token) break;
    }
    // 2. open each thread and classify its new messages
    const msgs = []; let next = 0, read = 0, failedThreads = 0;
    const worker = async () => { while(next < ids.length){ const id = ids[next++];
      let t; try { t = await gm('get_thread', {threadId:id, messageFormat:'PLAIN_TEXT'}); } catch(e){ failedThreads++; continue; } finally { read++; S.sync.step = `Reading Gmail · ${read} of ${ids.length} conversations`; render(); }
      (t.messages||[]).forEach(m => {
        if(!m.date || new Date(m.date).getTime() < after*1000) return;
        const dir = direction(m); if(dir === 'internal') return;
        const full = dir === 'inbound' || dir === 'outbound';
        msgs.push({id:m.id, thread:m.threadId || t.id, dir, at:m.date, from:addr(m.sender), to:(m.toRecipients||[]).map(addr), cc:(m.ccRecipients||[]).map(addr),
          subject:m.subject||'', snippet:decodeEntities(m.snippet||'').slice(0,300), body: full ? stripQuoted(m.plaintextBody || m.snippet || '').slice(0,20000) : null,
          files:(m.attachments||[]).map(a => a && (a.filename || a.name)).filter(Boolean)});
      });
    } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    if(failedThreads) throw {code:'tool_error', server:CFG.gmail, message:`${failedThreads} conversation${failedThreads>1?'s':''} could not be opened, so the sync mark was not moved`};
    // 3. save them (ingest_message skips anything already in the database and files each under its school)
    const arr = a => a && a.length ? `array[${a.map(lit).join(',')}]::text[]` : 'null';
    const results = {};
    for(let i = 0; i < msgs.length; i += 12){
      S.sync.step = `Saving to Supabase · ${Math.min(i+12, msgs.length)} of ${msgs.length} emails`; render();
      const chunk = msgs.slice(i, i+12);
      const r = await sql(`select json_build_object(${chunk.map((m,k) => `${lit('m'+k)}, ingest_message(${lit(m.id)}, ${lit(m.thread)}, ${lit(m.dir)}, ${lit(m.at)}::timestamptz, ${lit(m.from)}, ${arr(m.to)}, ${arr(m.cc)}, ${lit(m.subject)}, ${lit(m.snippet)}, ${lit(m.body)}, ${arr(m.files)})`).join(', ')}) as r`, true);
      const o = (r[0] && r[0].r) || {}; chunk.forEach((m,k) => results[m.id] = String(o['m'+k] || ''));
    }
    const fresh = msgs.filter(m => results[m.id] && results[m.id] !== 'exists');
    const unmatchedOut = fresh.filter(m => m.dir === 'outbound' && results[m.id] === 'unmatched');
    // 4. new replies to cold outreach: same handling as the evening agent's Step 2
    const newIn = fresh.filter(m => m.dir === 'inbound' && results[m.id] !== 'unmatched');
    let handled = {dnc:0, engaged:0, yours:0};
    if(newIn.length){
      S.sync.step = 'Checking new replies…'; render();
      const rows = await sql(`select m.gmail_message_id id, m.school_id, s.name, s.managed_by_ijas, s.stage from messages m join schools s on s.id = m.school_id where m.gmail_message_id in (${newIn.map(m => lit(m.id)).join(',')})`);
      const cold = rows.filter(r => !r.managed_by_ijas && !['do_not_contact','closed_lost','client'].includes(r.stage));
      handled.yours = rows.length - cold.length;
      if(cold.length){
        const byId = {}; newIn.forEach(m => byId[m.id] = m);
        const verdicts = await classifyReplies(cold.map(r => ({id:r.id, school:r.name, text:(byId[r.id].body || byId[r.id].snippet || '').slice(0,1200)})));
        const stmts = cold.map(r => {
          const m = byId[r.id]; const v = verdicts[r.id] || {kind:'reply', summary:''};
          const quote = String(m.body || m.snippet || '').replace(/\s+/g,' ').trim().slice(0,160);
          if(v.kind === 'unsubscribe' || v.kind === 'not_interested'){
            handled.dnc++;
            return `update contacts set email_status = 'unsubscribed', updated_at = now() where lower(email) = lower(${lit(m.from)});
              update schools set do_not_contact = true, stage = 'do_not_contact', dnc_reason = ${lit(quote)}, updated_at = now() where id = ${lit(r.school_id)};
              insert into activities (school_id, occurred_at, kind, summary, source) values (${lit(r.school_id)}, ${lit(m.at)}::timestamptz, 'reply', ${lit((v.kind === 'unsubscribe' ? 'Asked to be removed: ' : 'Not interested: ') + (v.summary || quote))}, ${lit(m.thread)});`;
          }
          handled.engaged++;
          return `update schools set stage = 'engaged', managed_by_ijas = true, status_note = ${lit(v.summary || quote)}, updated_at = now() where id = ${lit(r.school_id)};
            insert into activities (school_id, occurred_at, kind, summary, source) values (${lit(r.school_id)}, ${lit(m.at)}::timestamptz, 'reply', ${lit('Replied: ' + (v.summary || quote))}, ${lit(m.thread)});`;
        });
        await sql(stmts.join('\n') + '\nselect 1 as ok', true);
      }
    }
    // 5. move the sync mark forward and refresh the school totals
    await sql(`update sync_state set value = ${lit(started)}, updated_at = now() where key = 'gmail_synced_through';
      select recompute_school_stats() as n`, true);
    const count = d => fresh.filter(m => m.dir === d).length;
    const parts = [`${fresh.length} new email${fresh.length === 1 ? '' : 's'}`];
    if(fresh.length) parts.push(`${count('inbound')} received, ${count('outbound')} sent${count('bounce') ? ', ' + count('bounce') + ' bounced' : ''}`);
    if(handled.engaged) parts.push(`${handled.engaged} new repl${handled.engaged === 1 ? 'y' : 'ies'} moved to your pipeline`);
    if(handled.dnc) parts.push(`${handled.dnc} marked do not contact`);
    if(unmatchedOut.length) parts.push(`${unmatchedOut.length} sent to schools not in the database`);
    const summary = parts.join(' · ');
    if(runId) sql(`update agent_runs set finished_at = now(), outcome = 'ok', summary = ${lit('App sync: ' + summary + (unmatchedOut.length ? '. Unmatched: ' + unmatchedOut.map(m => m.to[0] + ' "' + m.subject + '"').join('; ') : ''))} where id = ${runId} returning id`, true).catch(() => {});
    S.sync = {running:false, done:new Date().toISOString(), result:summary, unmatched:unmatchedOut};
    S.gmailNew = {};
  } catch(e){
    const msg = errText(e, e && e.server) ;
    if(runId) sql(`update agent_runs set finished_at = now(), outcome = 'error', summary = ${lit('App sync failed: ' + msg)} where id = ${runId} returning id`, true).catch(() => {});
    S.sync = {running:false, error:'Sync stopped: ' + msg + ' Nothing is lost; tap Sync again. Emails already saved stay saved.'};
  }
  render();
  await refreshAll();
}
async function classifyReplies(items){
  const out = {};
  const fallback = () => items.forEach(it => { const t = it.text.toLowerCase();
    out[it.id] = {kind: /unsubscribe|remove (me|us)|take (me|us) off|stop (emailing|contacting)|do not contact/.test(t) ? 'unsubscribe' : /not interested|no thank|not at this time|not a (good )?fit|we('re| are) (all )?set|already (have|offer)/.test(t) ? 'not_interested' : 'reply', summary:''}; });
  if(!S.sample){ fallback(); return out; }
  try {
    const res = await S.sample.json(`You sort replies that schools sent to Cyber Square's cold outreach emails (a coding and robotics program for schools).
For each reply decide:
- "unsubscribe": asks to be removed, to stop emailing, or to unsubscribe.
- "not_interested": clearly says no, not interested, or already has a program and does not want to hear more.
- "reply": anything else, including questions, "maybe later", "send more info", or forwarding to someone. When unsure, choose "reply".
Also write a one-line summary (max 15 words) of what they said.
Reply with only a JSON array of {"id": string, "kind": string, "summary": string}.

${JSON.stringify(items)}`, {modelTier:'quick'});
    (Array.isArray(res) ? res : []).forEach(r => { if(r && r.id) out[String(r.id)] = {kind:['unsubscribe','not_interested','reply'].includes(r.kind) ? r.kind : 'reply', summary:String(r.summary||'').slice(0,200)}; });
    items.forEach(it => { if(!out[it.id]) out[it.id] = {kind:'reply', summary:''}; });
  } catch(e){ fallback(); }
  return out;
}

  const o = $('#overlay');
  if(S.composer) return o.innerHTML = overlayComposer();
  if(S.modal) return o.innerHTML = overlayModal();
  o.innerHTML = '';
}
function overlayComposer(){
  const c = S.composer; const l = c.lead; const v = c.versions[c.idx];
  return `<div class="sheet-wrap"><div class="scrim" data-act="closeov"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="cmp-t">
    <div class="grab"><i></i></div>
    <div class="hd"><span class="ico" style="width:32px;height:32px;border-radius:10px;background:var(--claude-soft);color:var(--claude)">${svg('spark',18)}</span>
      <span class="stack" style="gap:0;flex:1;min-width:0"><h2 id="cmp-t" style="margin:0;font-size:17px">Reply to ${esc(l.first || l.contact || l.school)}</h2><span class="xs muted">Claude drafts from the emails and notes in your database</span></span>
      <button type="button" class="iconbtn" style="border:none" data-act="closeov" aria-label="Close">${svg('x',20,2)}</button></div>
    <div class="bd">
      ${c.lastIn ? `<div class="quote"><div class="xs b muted" style="letter-spacing:.06em">${esc((l.first || 'They').toUpperCase())} WROTE · ${esc(rel(c.lastIn.at).toUpperCase())}</div>“${esc(String(c.lastIn.text||'').slice(0,400))}”</div>` : ''}
      <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><div class="kv" style="border-bottom:1px solid var(--line)"><span>To</span><span style="word-break:break-all">${esc(c.to || '—')}</span></div><div class="kv"><span>Subject</span><span>${esc(c.subject || '—')}</span></div></div>
      <div class="between xs muted"><span>${c.loading ? 'Reading the conversation…' : c.streaming ? 'Claude is writing…' : c.versions.length ? `Version ${c.idx+1} of ${c.versions.length}${v && v.edited ? ' · edited' : ''}` : ''}</span>
        <span class="row" style="gap:4px"><button type="button" class="iconbtn" style="width:34px;height:34px;border-radius:8px" data-act="ver" data-k="-1" aria-label="Previous version" ${c.idx <= 0 ? 'disabled' : ''}>${svg('back',14,2.2)}</button>
        <button type="button" class="iconbtn" style="width:34px;height:34px;border-radius:8px" data-act="ver" data-k="1" aria-label="Next version" ${c.idx >= c.versions.length-1 ? 'disabled' : ''}>${svg('chev',14,2.2)}</button></span></div>
      ${c.error ? `<div class="banner err" role="alert">${svg('alert',18)}<span>${esc(c.error)}</span></div>` : ''}
      <label for="cmp-body" class="sr">Email body</label>
      <textarea id="cmp-body" class="draft" ${c.streaming || c.loading ? 'readonly' : ''} placeholder="${c.loading || c.streaming ? 'Thinking…' : 'Write your reply'}">${esc(v ? v.text : '')}</textarea>
      <div class="stack" style="gap:8px"><span class="xs b muted">Change it</span>
        <div class="row" style="flex-wrap:wrap;gap:6px">${['Shorter','Warmer','More formal','Suggest call times','Answer the price question'].map(x => `<button type="button" class="chip" style="height:34px;font-weight:500" data-act="hint" data-k="${x}" aria-pressed="${c.hint===x}">${x}</button>`).join('')}</div>
        <label for="cmp-ask" class="sr">Tell Claude what to change</label>
        <input id="cmp-ask" class="field" type="text" placeholder="Or tell Claude… e.g. mention we can start in October" value="${esc(c.ask||'')}"></div>
    </div>
    <div class="ft">
      <button type="button" class="btn full" data-act="regen" ${c.streaming || c.loading || !S.sample ? 'disabled' : ''}>${c.streaming ? '<span class="spin"></span> Writing' : svg('refresh',16,2) + ' Regenerate'}</button>
      <div class="grid2"><button type="button" class="btn" data-act="savedraft" ${c.busy || !v ? 'disabled' : ''}>Save to Gmail drafts</button>
      <button type="button" class="btn ${c.confirm ? 'danger' : 'primary'}" data-act="sendreply" ${c.busy || !v || c.streaming ? 'disabled' : ''} style="height:48px">${c.busy ? '<span class="spin"></span>' : c.confirm ? 'Tap again to send' : svg('send',16,2) + ' Send'}</button></div>
    </div></section></div>`;
}
function overlayModal(){
  const m = S.modal; const l = m.lead;
  const opts = ['engaged','meeting_booked','proposal_sent','client','closed_lost','do_not_contact'];
  return `<div class="sheet-wrap"><div class="scrim" data-act="closeov"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="md-t">
    <div class="grab"><i></i></div><div class="hd"><h2 id="md-t" style="margin:0;font-size:17px;flex:1">${m.kind === 'stage' ? 'Change stage' : 'Add a note'} · ${esc(l.school)}</h2>
    <button type="button" class="iconbtn" style="border:none" data-act="closeov" aria-label="Close">${svg('x',20,2)}</button></div>
    <form class="bd" id="md-form">
      ${m.kind === 'stage' ? `<label for="md-status" class="xs b muted">Stage</label><select id="md-status" class="field">${opts.map(o => `<option value="${o}" ${o===l.stage?'selected':''}>${esc(STAGES[o].label)}</option>`).join('')}</select>` : ''}
      <label for="md-note" class="xs b muted">${m.kind === 'stage' ? 'Status note (optional)' : 'Note'}</label><textarea id="md-note" class="field" placeholder="e.g. Call booked for Oct 1, 10 am with Lauren and her VP"></textarea>
      <label for="md-next" class="xs b muted">Next action (optional)</label><input id="md-next" class="field" type="text" placeholder="e.g. Send proposal" value="">
      <label for="md-date" class="xs b muted">Next action date (optional)</label><input id="md-date" class="field" type="date" value="${esc(l.next||'')}">
      <div class="xs muted">Saved straight to Supabase. Every Claude agent reads it from there.</div>
    </form>
    <div class="ft"><button type="button" class="btn primary full" data-act="savemodal" ${m.busy ? 'disabled' : ''}>${m.busy ? '<span class="spin"></span>' : 'Save'}</button></div></section></div>`;
}

/* ---------- Claude drafting ---------- */
function stripQuoted(t){
  const out = []; for(const line of String(t||'').replace(/\r/g,'').split('\n')){
    if(/^On .+wrote:\s*$/.test(line.trim()) || /^-{2,}\s*Original Message/i.test(line.trim())) break;
    if(/^\s*>/.test(line)) continue; out.push(line); }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function openComposer(l){
  const c = S.composer = {lead:l, versions:[], idx:-1, loading:true, streaming:false, hint:'', ask:'', lastIn:l.lastIn};
  render();
  if(!S.detail[l.id]) await loadDetail(l.id);
  const d = S.detail[l.id] || {msgs:[], timeline:[]};
  const msgs = (d.msgs||[]).slice().sort((a,b) => String(a.sent_at).localeCompare(String(b.sent_at)));
  const lastIn = l.lastIn; const lastOut = [...msgs].reverse().find(m => m.dir === 'outbound');
  // reply to their latest message when there is one, otherwise continue our last thread
  const target = lastIn ? {id:lastIn.id, subject:lastIn.subject} : lastOut ? {id:lastOut.id, subject:lastOut.subject} : null;
  c.replyTo = target && target.id;
  c.to = lastIn && lastIn.from && !isMine(lastIn.from) ? lastIn.from : l.email;
  c.subject = target ? 'Re: ' + String(target.subject||'').replace(/^(re:\s*)+/i,'') : `Cyber Square · ${l.school}`;
  c.thread = msgs.map(m => `From: ${m.dir === 'outbound' ? 'Ijas (us)' : m.from_email}\nDate: ${fmtDay(m.sent_at)}\nSubject: ${m.subject||''}\n\n${stripQuoted(m.text).slice(0,2500)}`).join('\n\n-----\n\n');
  if(lastIn && lastIn.unsynced) c.thread += `\n\n-----\n\nFrom: ${lastIn.from}\nDate: ${fmtDay(lastIn.at)}\nSubject: ${lastIn.subject||''}\n\n${lastIn.text}`;
  c.notes = (d.timeline||[]).filter(t => !String(t.kind).startsWith('email:')).slice(0,8).map(t => `${fmtDay(t.at)} ${t.kind}: ${t.summary}`).join('\n');
  c.loading = false; render();
  if(!S.sample){ c.error = 'Claude drafting is not available in this view. You can still write and send the reply yourself.'; c.versions.push({text:''}); c.idx = 0; render(); return; }
  draft(false);
}
function draftPrompt(c){
  const l = c.lead; const extra = [c.hint, (c.ask||'').trim()].filter(Boolean).join('. ');
  const prev = c.versions.length ? c.versions[c.idx].text : '';
  return `You are drafting an email for Ijasali Manalody, co-founder of Cyber Square. Cyber Square runs hands-on coding and robotics programs in schools: our trainer comes to the school, runs every session during the school day or after school, and manages the students, so teachers have nothing to prepare.

Write the next email in this conversation with ${l.contact || 'the school'} at ${l.school}.

Rules:
- Plain text only. No markdown, no subject line.
- Start with "Hi ${l.first || 'there'},".
- If they asked something in their last message, answer it directly first. If we sent the last message, write a short, friendly follow-up that gives them a reason to reply.
- Keep it under 140 words. End with one clear next step, usually a 15 minute call.
- Never offer free trials. Never say where Cyber Square is based. Never pitch Casa (ages 3–6), preschool or ScratchJr.
- Only mention prices if our earlier emails or the notes below already gave them; otherwise offer to give an exact number on a call.
- Do not invent facts, clients, numbers or dates that are not in the conversation or notes.
- End with exactly:
Ijasali Manalody
Co-founder, Cyber Square

From the Cyber Square database:
Stage: ${(STAGES[l.stage]||{}).label || l.stage}
${l.statusNote ? 'Status: ' + l.statusNote + '\n' : ''}${l.nextAction ? 'Next action: ' + l.nextAction + '\n' : ''}${l.notes ? 'Notes: ' + l.notes + '\n' : ''}${c.notes ? 'Recent activity:\n' + c.notes + '\n' : ''}
Conversation, oldest first:
${c.thread || '(no emails recorded)'}
${prev && extra ? `\nThe previous draft was:\n${prev}\n` : ''}${extra ? `\nChange requested by Ijas: ${extra}\n` : ''}
Reply with only the email text.`;
}
async function draft(regen){
  const c = S.composer; if(!c || !S.sample) return;
  c.streaming = true; c.error = ''; c.confirm = false;
  const v = {text:''}; c.versions.push(v); c.idx = c.versions.length - 1; render();
  try {
    const res = await S.sample(draftPrompt(c), {cache: regen ? false : {gcTime:600000}, onText: ({text}) => { v.text = text; const t = document.getElementById('cmp-body'); if(t) t.value = text; }});
    v.text = res.text.trim();
    if(res.truncated) c.error = 'The draft was cut short. Tap Regenerate or ask for a shorter reply.';
  } catch(e){
    if(e && e.text) v.text = e.text;
    const map = {not_granted:'You declined Claude drafting for this page. You can still write the reply yourself.', sampling_disabled:'Claude drafting is not available for this account.',
      rate_limited:'You have hit your Claude usage limit for now. Try again later or write the reply yourself.', refused:'Claude could not draft this one. Try a different instruction.',
      cancelled:'', session_expired:'Sign in to Claude again, then tap Regenerate.'};
    c.error = map[e && e.code] !== undefined ? map[e.code] : 'Claude could not finish the draft. Tap Regenerate to try again.';
    if(!v.text){ c.versions.pop(); c.idx = c.versions.length - 1; if(c.idx < 0){ c.versions.push({text:''}); c.idx = 0; } }
  }
  c.streaming = false; render();
}
async function sendReply(asDraft){
  const c = S.composer; const l = c.lead; const body = (document.getElementById('cmp-body') || {}).value || '';
  if(!body.trim()){ c.error = 'Write something first.'; return render(); }
  if(!c.to){ c.error = 'No email address for this school.'; return render(); }
  if(!asDraft && !c.confirm){ c.confirm = true; return render(); }
  c.busy = true; c.error = ''; render();
  let res;
  try {
    if(asDraft) res = await gm('create_draft', Object.assign({to:[c.to], subject:c.subject, body}, c.replyTo ? {replyToMessageId:c.replyTo} : {}));
    else if(c.replyTo) res = await gm('reply', {messageId:c.replyTo, to:[c.to], body});
    else res = await gm('send_message', {to:[c.to], subject:c.subject, body});
  } catch(e){ c.busy = false; c.confirm = false; c.error = (asDraft ? 'Not saved. ' : 'Not sent. ') + errText(e, CFG.gmail) + (asDraft ? '' : ' Check Gmail’s Sent folder before trying again.'); return render(); }
  let logged = true;
  try {
    if(asDraft) await sql(`insert into activities (school_id, occurred_at, kind, summary, source) values (${lit(l.id)}, now(), 'note', ${lit('Reply drafted in Gmail: ' + body.slice(0,160))}, 'cs-tracker-app') returning id`, true);
    else logged = await recordSent(res, c.to, c.subject, body, l.id);
  } catch(e){ logged = false; }
  S.composer = null;
  toast(asDraft ? 'Saved to Gmail drafts' : logged ? `Sent to ${c.to}` : `Sent to ${c.to}. The evening agent will add it to the database.`);
  if(!asDraft){ delete S.gmailNew[l.id]; await Promise.all([loadSchools(), loadDetail(l.id), S.extra[l.id] ? loadOne(l.id) : null]); }
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el || el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox')) return;
  const act = el.dataset.act, k = el.dataset.k;
  switch(act){
    case 'tab': S.tab = k; S.lead = null; lsSet('tab', k); render(); window.scrollTo(0,0); break;
    case 'refresh': refreshAll(); break;
    case 'sync': syncGmail(); break;
    case 'pfilter': S.pipeFilter = k; render(); break;
    case 'region': S.bankRegion = k; render(); break;
    case 'wtab': S.weekTab = k; render(); break;
    case 'lead': S.lead = k; render(); window.scrollTo(0,0); if(!leads().some(x => x.key === k)) loadOne(k); loadDetail(k); break;
    case 'day': S.openDays.has(k) ? S.openDays.delete(k) : S.openDays.add(k); render(); break;
    case 'back': S.lead = null; render(); break;
    case 'reloadlead': if(S.lead){ loadSchools(); if(S.extra[S.lead]) loadOne(S.lead); loadDetail(S.lead); } break;
    case 'compose': { const l = findSchool(S.lead); if(l) openComposer(l); } break;
    case 'closeov': S.composer = null; S.modal = null; render(); break;
    case 'ver': { const c = S.composer; c.idx = Math.max(0, Math.min(c.versions.length-1, c.idx + (+k))); c.confirm = false; render(); } break;
    case 'hint': { const c = S.composer; c.ask = (document.getElementById('cmp-ask')||{}).value || c.ask; c.hint = c.hint === k ? '' : k; render(); } break;
    case 'regen': { const c = S.composer; c.ask = (document.getElementById('cmp-ask')||{}).value || ''; draft(true); } break;
    case 'sendreply': sendReply(false); break;
    case 'savedraft': sendReply(true); break;
    case 'stage': case 'note': { const l = findSchool(S.lead); if(l){ S.modal = {kind:act, lead:l}; render(); } } break;
    case 'savemodal': {
      const m = S.modal; const note = ($('#md-note')||{}).value.trim(); const nextA = ($('#md-next')||{}).value.trim(); const nextD = ($('#md-date')||{}).value;
      const stage = m.kind === 'stage' ? $('#md-status').value : '';
      if(m.kind === 'note' && !note){ toast('Write a note first'); break; }
      m.busy = true; render();
      try {
        if(m.kind === 'stage') await setStage(m.lead, stage, nextA, nextD && nextD !== m.lead.next ? nextD : '', note);
        else await addNote(m.lead, note, nextA, nextD && nextD !== m.lead.next ? nextD : '');
        S.modal = null; toast('Saved to the database');
        await Promise.all([loadSchools(), loadDetail(m.lead.id), loadStats(), loadSchedule(), S.extra[m.lead.id] ? loadOne(m.lead.id) : null]);
      } catch(e){ m.busy = false; toast('Not saved. ' + errText(e, CFG.supabase)); }
      render(); } break;
    case 'dec': { const n = k; if(S.decisions[n] === el.dataset.v) S.decisions[n] = S.review && S.review.pre ? 'ok' : ''; else S.decisions[n] = el.dataset.v; S.confirmDecision = false; render(); } break;
    case 'decide': {
      if(!S.confirmDecision){ S.confirmDecision = true; render(); break; }
      const txt = decisionText(); const rv = S.review; if(!txt){ S.confirmDecision = false; render(); break; }
      S.busy.decide = true; render();
      try { await gm('reply', {messageId:rv.messageId, to:[CFG.me], body:txt + '\n\n(sent from the CS Tracker app)'});
        rv.decision = txt; rv.decisionDate = new Date().toISOString(); lsSet('review', rv); toast('Sent to the morning sender: ' + txt); }
      catch(e){ toast('Not sent. ' + errText(e, CFG.gmail)); }
      S.busy.decide = false; S.confirmDecision = false; render(); } break;
    case 'bsel': { S.bankSel.has(k) ? S.bankSel.delete(k) : S.bankSel.add(k); S.confirmBank = ''; render(); } break;
    case 'flag': {
      if(S.confirmBank !== k){ S.confirmBank = k; render(); break; }
      S.busy.flag = true; render();
      try { await flagSchools([...S.bankSel], k); toast(k === 'casa' ? 'Marked Casa only' : 'Marked do not contact'); S.bankSel.clear(); S.confirmBank = ''; await Promise.all([loadBank(), loadStats()]); }
      catch(e){ toast('Not saved. ' + errText(e, CFG.supabase)); }
      S.busy.flag = false; render(); } break;
  }
});
document.addEventListener('input', ev => {
  if(ev.target.id === 'cmp-body' && S.composer){ const v = S.composer.versions[S.composer.idx]; if(v){ v.text = ev.target.value; v.edited = true; } S.composer.confirm = false; }
  if(ev.target.id === 'cmp-ask' && S.composer) S.composer.ask = ev.target.value;
});
document.addEventListener('submit', ev => ev.preventDefault());
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && (S.composer || S.modal)){ S.composer = null; S.modal = null; render(); } });

/* ---------- boot ---------- */
async function refreshAll(){
  if(!S.mcp) return;
  await Promise.allSettled([loadSchools(), loadStats(), loadBatch(), loadSchedule(), loadWeek(), loadBank()]);
  checkGmailSinceSync();
  if(S.lead) loadDetail(S.lead);
}
async function boot(){
  render();
  if(!window.claude || !window.claude.use){ S.noRuntime = true; return render(); }
  const [mcp, sample] = await Promise.all(['mcp','sample'].map(n => window.claude.use(n).catch(() => null)));
  S.mcp = mcp; S.sample = sample;
  if(!mcp){ S.noRuntime = true; return render(); }
  render();
  refreshAll();
}
boot();
})();
</script>
