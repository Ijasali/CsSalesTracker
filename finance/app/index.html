<style>

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px 16px 104px}

.sub{font-size:13px;color:var(--muted);font-weight:500}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.ic.inv{font:700 11px var(--body);background:var(--good-soft);color:var(--good)}

.t1{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:14px;font-weight:700;white-space:nowrap}

.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}

.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted);font-weight:700}
.inp{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;width:100%;box-sizing:border-box}
textarea.inp{padding:12px 14px;min-height:72px}
.amount-in{font:500 40px var(--display);border:0;background:transparent;text-align:center;width:100%;padding:6px 0}
.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;padding:6px 0;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs .add{width:52px;height:52px;border-radius:26px;background:var(--ink);color:var(--ground);justify-content:center;min-width:0;padding:0}
.chart{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.chart .in{position:relative;padding:0 8px;box-sizing:border-box}
.plot{position:relative;display:flex;align-items:flex-end;height:170px;border-bottom:1px solid var(--line)}
.plot .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--avg);pointer-events:none}
.col{flex-shrink:0;width:52px;height:170px;padding:0 8px;box-sizing:border-box;border:0;background:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;cursor:pointer}
.col i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--bar)}
.col[aria-pressed="true"] i{background:var(--bar-sel)}
.col span{font-size:11px;font-weight:700;color:var(--muted)} .col[aria-pressed="true"] span{color:var(--ink)}
.mlab{display:flex;padding-top:6px} .mlab div{flex-shrink:0;width:52px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column}
.mlab div.on{color:var(--ink);font-weight:700} .mlab small{font-size:10px;min-height:13px}
.pct{min-width:48px;box-sizing:border-box;text-align:center;padding:4px 0;border-radius:8px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent-strong)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.review{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line2)}
.review:first-child{border-top:0}
.review select{min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;max-width:100%}
.check{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0}
.skel{color:var(--muted);font-size:14px;padding:12px 0}
.nplot{position:relative;height:190px;display:flex}
.ncol{position:relative;flex-shrink:0;width:52px;height:100%;border:0;background:none;padding:0;cursor:pointer;border-radius:8px}
.ncol[aria-pressed="true"]{background:var(--track)}
.ncol i{position:absolute;left:12px;right:12px;display:block}
.ncol i.g{background:var(--gain);border-radius:4px 4px 0 0} .ncol i.l{background:var(--loss);border-radius:0 0 4px 4px}
.ncol span{position:absolute;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.ncol[aria-pressed="true"] span{color:var(--ink)}
.nzero{position:absolute;left:0;right:0;border-top:1px solid var(--ink2);pointer-events:none}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.ntable{width:100%;border-collapse:collapse;font-size:13px}
.ntable th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:6px 0}
.ntable th:first-child,.ntable td:first-child{text-align:left}
.ntable td{text-align:right;padding:8px 0;border-top:1px solid var(--line2);white-space:nowrap}
.ntable tr.on td{font-weight:700}
@media (prefers-reduced-motion:no-preference){.chart{scroll-behavior:smooth}}
</style>

<script>
(function(){

const CFG = {

/* ---------- small helpers ---------- */

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('en-CA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const cad = n => (Number(n) < 0 ? '−' : '') + '$' + fmt.format(Math.abs(Number(n) || 0));
const fmt0 = new Intl.NumberFormat('en-CA', {maximumFractionDigits: 0});
const cad0 = n => (Number(n) < 0 ? '−' : '') + '$' + fmt0.format(Math.abs(Number(n) || 0));
const cadS = n => (Number(n) > 0 ? '+' : '') + cad(n);
const short$ = n => { n = Math.abs(n); return '$' + (n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : Math.round(n)); };
function todayISO(){
  const p = new Intl.DateTimeFormat('en-CA', {timeZone: CFG.tz, year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());

const monthOf = iso => iso.slice(0, 7) + '-01';
function addMonths(m, k){ const y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + k; const d = new Date(Date.UTC(y, mo, 1)); return d.toISOString().slice(0, 10); }
const mLabel = m => MONTHS_L[+m.slice(5,7) - 1] + ' ' + m.slice(0,4);

  const base = wd + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + (iso.slice(0,4) !== t.slice(0,4) ? ' ' + iso.slice(0,4) : '');
  if(iso === t) return 'Today · ' + base;
  const y = new Date(new Date(t + 'T12:00:00Z').getTime() - 864e5).toISOString().slice(0,10);
  return iso === y ? 'Yesterday · ' + base : base;
}
const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

function N(n){ n = Number(n); if(!isFinite(n)) throw {code:'bad_input', message:'Enter a valid amount'}; return String(Math.round(n * 100) / 100); }
function D(d){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d))) throw {code:'bad_input', message:'Enter a valid date'}; return "'" + d + "'"; }
function newId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
const initials = name => (String(name).replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2) || '·').toUpperCase();

/* ---------- connector calls ---------- */
async function call(tool, input, write){
  try {
    const r = await S.mcp.callTool(CFG.server, tool, input, {cache: false});
    return r.payload !== undefined ? r.payload : r;
  } catch(e){
    if(!write && e && e.retryable && !e._retried){
      await new Promise(r => setTimeout(r, (e.retryAfterMs || 1200) + Math.random() * 800));
      try { const r = await S.mcp.callTool(CFG.server, tool, input, {cache: false}); return r.payload !== undefined ? r.payload : r; }
      catch(e2){ e2._retried = true; throw e2; }
    }
    throw e;
  }
}
function rowsFrom(p){
  if(Array.isArray(p)) return p;
  let t = typeof p === 'string' ? p : (p && (p.result || p.text)) || '';
  if(typeof t !== 'string') return Array.isArray(t) ? t : [];
  const m = t.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  const body = m ? m[1] : t;
  const i = body.indexOf('['), j = body.lastIndexOf(']');
  if(i < 0 || j < i) return [];
  return JSON.parse(body.slice(i, j + 1));
}
async function sql(query, write){
  const p = await call('execute_sql', {project_id: CFG.project, query}, write);
  const t = typeof p === 'string' ? p : (p && p.result) || '';
  if(typeof t === 'string' && /^\s*(ERROR|error)[:\s]/.test(t)) throw {code:'tool_error', message: t.slice(0, 300)};
  return rowsFrom(p);
}
async function one(query, write){ const r = await sql(query, write); return r[0] ? r[0].data : null; }
function errText(e){
  const c = e && e.code;
  if(c === 'server_not_connected' || c === 'selection_required') return 'Add the Supabase connector in claude.ai Settings → Connectors, then reload.';
  if(c === 'needs_reauth') return 'Reconnect Supabase in claude.ai Settings → Connectors, then reload.';
  if(c === 'not_in_manifest' || c === 'not_granted' || c === 'consent_required') return 'This app needs permission to use your Supabase connector. Reload and choose Allow.';
  if(c === 'blocked_by_policy' || c === 'approval_required') return 'Your organization’s settings block this Supabase call.';
  if(c === 'server_unavailable') return 'Supabase didn’t answer. If the project is paused, restore it in the Supabase dashboard, then try again.';
  if(c === 'bad_input') return e.message;
  if(c === 'db') return webErr(e);
  if(c === 'tool_error') return 'Supabase refused the request: ' + String(e.message || '').replace(/^ERROR:\s*/, '').slice(0, 200);
  return (e && e.message) ? String(e.message).slice(0, 200) : 'Something went wrong. Try again.';
}
function webErr(e){
  const m = String((e && e.message) || '');
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Can’t reach the database. Check your connection. If the Supabase project is paused, restore it in the Supabase dashboard.';
  if(/JWT|refresh token|not authenticated/i.test(m)) return 'Your sign-in expired. Sign out and sign in again.';
  return m.slice(0, 200) || 'Something went wrong. Try again.';
}
function toast(msg){ S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 3200); }

// On the web the app calls them through Supabase as the signed-in person; inside Claude it runs
// `select public.app_x(...)` through the viewer's Supabase connector.
async function api(name, p, write){
  if(S.web){
    const {data, error} = await S.sb.rpc(name, p === undefined ? undefined : {p});
    if(error) throw {code: 'db', message: error.message, status: error.code};
    return data;
  }
  return one(`select public.${name}(${p === undefined ? '' : lit(JSON.stringify(p)) + '::jsonb'}) as data`, write);
}

  root.innerHTML = body + (app ? tabs() : '') + (S.sheet ? sheet() : '') + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');

  const ch = $('.chart');
  if(ch) ch.style.scrollBehavior = 'auto';
  if(ch && S.view === 'insights' && S.insKind === 'net'){
    if(!S.netScrolled){ S.netScrolled = true; const sel = ch.querySelector('[aria-pressed="true"]'); ch.scrollLeft = sel ? sel.offsetLeft - ch.clientWidth / 2 + 26 : ch.scrollWidth; }

async function doLogin(){
  const l = S.login; l.err = null; l.msg = null;
  const email = l.email.trim(), password = l.pw;
  if(!email || !password){ l.err = 'Enter your email and password.'; return render(); }
  if(l.mode === 'up' && password.length < 8){ l.err = 'Use at least 8 characters for the password.'; return render(); }
  l.busy = true; render();
  try {
    store('email', email);
    if(l.mode === 'up'){
      const {data, error} = await S.sb.auth.signUp({email, password});
      if(error) throw error;
      if(!data.session){ l.busy = false; l.mode = 'in'; l.pw = ''; l.msg = 'Login created. Confirm it from the email Supabase sent you, then sign in.'; return render(); }
      await signedIn(data.session.user);
    } else {
      const {data, error} = await S.sb.auth.signInWithPassword({email, password});
      if(error) throw error;
      await signedIn(data.user);
    }
  } catch(e){
    const m = String((e && e.message) || '');
    l.err = /invalid login credentials/i.test(m) ? 'That email and password don’t match. If you haven’t made a login yet, choose “Create a login”.'
      : /already registered/i.test(m) ? 'That email already has a login. Sign in instead.'
      : /signups? not allowed|signup.*disabled/i.test(m) ? 'New logins are switched off for this app.'
      : /email not confirmed/i.test(m) ? 'Confirm your email first: open the link Supabase emailed you.'
      : webErr(e);
  }
  l.busy = false; render();
}

/* ---- balances ---- */
// Net worth counts active accounts marked "in net worth" (a.nw), or every active account while
// "Count everything" is on.
function nwNote(tot){
  const hiddenN = B().accounts.filter(a => a.active && !a.nw).length;
  if(S.countAll) return hiddenN ? `<div class="hero-note"><span>Counting every account</span><button data-act="countall">Leave out ${hiddenN} hidden</button></div>` : '';
  if(!tot.leftN) return '';
  return `<div class="hero-note"><span>${tot.leftN} hidden account${tot.leftN > 1 ? 's' : ''} not counted (${cad0(tot.leftOut)})</span><button data-act="countall">Count everything</button></div>`;
}
function totals(filterOwner){
  const r = {assets: 0, owed: 0, bank: 0, inv: 0, byOwner: {}, leftOut: 0, leftN: 0};
  for(const a of B().accounts){
    if(!a.active) continue;
    const k = ownerKey(a);
    if(filterOwner && filterOwner !== 'all' && k !== filterOwner) continue;
    const bal = Number(a.bal) || 0;
    if(!a.nw && !S.countAll){ r.leftOut += bal; r.leftN++; continue; }
    r.byOwner[k] = (r.byOwner[k] || 0) + bal;
    if(LIAB.includes(a.type)){ r.owed += -bal; }
    else { r.assets += bal; if(['chequing','savings','cash','prepaid'].includes(a.type)) r.bank += bal; else r.inv += bal; }
  }
  r.net = r.assets - r.owed;
  return r;
}

/* ---- home ---- */
function budgetSummary(md){
  const bud = (md && md.budgets) || [];
  if(!bud.length) return null;
  const spentBy = {}; ((md && md.exp) || []).forEach(x => { spentBy[x.cid] = Number(x.amt); });
  let limit = 0, spent = 0; const over = [];
  for(const b of bud){ const s = spentBy[b.cid] || 0; limit += Number(b.amount); spent += s; if(s > Number(b.amount) && Number(b.amount) > 0) over.push({cid: b.cid, by: s - Number(b.amount)}); }
  over.sort((a, b) => b.by - a.by);
  return {limit, spent, over};
}
function daysLeft(m){
  const t = todayISO(); if(monthOf(t) !== m) return 0;
  const last = new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).getUTCDate();
  return last - +t.slice(8,10) + 1;
}

function txRow(t){
  const a = acct(t.aid); const amt = Number(t.amt);
  const kind = t.kind; const name = t.payee || t.descr || t.note || (kind === 'transfer' ? 'Transfer' : catName(t.cid));
  let meta, ic, cls = '';
  if(kind === 'transfer'){ const o = acct(t.other_aid); meta = (amt < 0 ? 'To ' : 'From ') + (o ? o.name : 'another account') + ' · ' + (a ? a.name : ''); ic = '⇄'; cls = ' tr'; }
  else { meta = catName(t.cid) + ' · ' + (a ? a.name : ''); ic = initials(topName(t.cid)); cls = kind === 'income' ? ' in' : ''; }
  const col = kind === 'income' ? ' pos' : (kind === 'transfer' ? ' muted' : '');
  return `<button class="item" data-act="edit" data-id="${t.id}"><span class="ic${cls}" aria-hidden="true">${esc(ic.slice(0, 2))}</span><span class="grow"><span class="t1" style="display:block">${esc(name)}${t.review ? ' <span class="badge warn">Check</span>' : ''}</span><span class="t2" style="display:block">${esc(meta)}</span></span><span class="amt${col}">${kind === 'transfer' ? cad(Math.abs(amt)) : cadS(amt)}</span></button>`;
}

/* ---- accounts ---- */

    <div class="tiles"><div class="tile" style="cursor:default"><span class="k">Bank & cash</span><span class="v">${cad0(tot.bank)}</span></div><div class="tile" style="cursor:default"><span class="k">Investments</span><span class="v">${cad0(tot.inv)}</span></div><div class="tile" style="cursor:default"><span class="k">Owed</span><span class="v owed">${cad0(tot.owed)}</span></div></div></section>`;

  if(S.err.nw) h += banner(S.err.nw, true);

    h += `<section class="card tight">${head}<div class="list">${list.sort((a, b) => Math.abs(b.bal) - Math.abs(a.bal)).map(acctRow).join('')}</div></section>`;

    h += `<button class="link" data-act="hidden" style="align-self:flex-start">${S.showHidden ? 'Hide' : 'Show'} ${hidden.length} inactive account${hidden.length > 1 ? 's' : ''}</button>`;
    if(S.showHidden) h += `<section class="card tight"><div class="list">${hidden.map(acctRow).join('')}</div><span class="xs muted" style="padding-bottom:10px">No activity in the last 18 months. They never count in net worth.</span></section>`;

}
function acctRow(a){
  const liab = LIAB.includes(a.type); const inv = INVEST.includes(a.type) || a.type === 'business';
  const cls = liab ? 'debt' : (inv ? 'inv' : 'acct');
  const typeLabel = {chequing:'Chequing', savings:'Savings', cash:'Cash', prepaid:'Prepaid card', credit_card:'Credit card', line_of_credit:'Line of credit', tfsa:'TFSA', rrsp:'RRSP', fhsa:'FHSA', resp:'RESP', gic:'GIC', non_registered:'Investment', crypto:'Crypto', business:'Business', property:'Property', mortgage:'Mortgage', loan:'Loan', receivable:'Money lent'}[a.type] || a.type;
  const bal = Number(a.bal);
  const meta = [typeLabel, a.institution, a.active && !a.nw ? 'hidden from totals' : '', a.incl ? '' : 'spending not counted', a.last_txn ? 'last ' + a.last_txn : ''].filter(Boolean).join(' · ');
  const valCls = liab ? (bal < 0 ? ' neg' : '') : '';
  const inner = `<span class="ic ${cls}" aria-hidden="true">${esc(initials(a.institution || a.name))}</span><span class="grow"><span class="t1" style="display:block">${esc(a.name)}</span><span class="row" style="gap:6px">${S.owner === 'all' ? ownerBadge(a) : ''}<span class="t2">${esc(meta)}</span></span></span><span class="amt${valCls}">${liab ? cad(Math.abs(bal)) + (bal < 0 ? ' owed' : '') : cad(bal)}</span>`;
  if(!a.active) return `<button class="item" data-act="acct" data-id="${a.id}">${inner}</button>`;
  const amt = `<span class="amt${valCls}">${liab ? cad(Math.abs(bal)) + (bal < 0 ? ' owed' : '') : cad(bal)}</span>`;
  return `<div class="item acctrow${!a.nw && !S.countAll ? ' off' : ''}"><button class="rowbtn" data-act="acct" data-id="${a.id}"><span class="row sp" style="width:100%;align-items:flex-start;gap:10px"><span class="t1">${esc(a.name)}</span>${amt}</span><span class="row" style="gap:6px;width:100%;min-width:0">${S.owner === 'all' ? ownerBadge(a) : ''}<span class="t2">${esc(meta)}</span></span></button><button class="eye" data-act="nweye" data-id="${a.id}" aria-pressed="${!!a.nw}" aria-label="${a.nw ? 'Hide ' + esc(a.name) + ' from totals' : 'Count ' + esc(a.name) + ' in totals'}">${svg(a.nw ? 'eye' : 'eyeoff', 22)}</button></div>`;
}

  if(k === 'net') return h + viewNet(md) + `</main>`;

  if(k === 'expense' && (md.accts || []).length){

  }

/* ---- net: income minus spending ---- */
function viewNet(md){
  const inc = Number(md.income), sp = Number(md.spent), net = inc - sp;
  let h = `<section class="card" style="gap:6px"><span class="sm muted sb">Income minus spending in ${esc(mLabel(S.month))}</span><span class="big" style="font-size:34px">${cadS(net)}</span>
    <div class="row sp sm"><span>Income</span><span class="b">${cad(inc)}</span></div>
    <div class="row sp sm"><span>Spent</span><span class="b">−${cad(sp)}</span></div>
    <span class="sm ${net >= 0 ? 'pos' : 'neg'} sb">${inc > 0 ? (net >= 0 ? 'You kept ' + Math.round(net / inc * 100) + '% of what came in' : 'Spent ' + cad(-net) + ' more than came in') : (sp ? 'No income recorded this month' : 'Nothing recorded this month')}</span></section>`;
  if(S.err.net) h += banner(S.err.net, true);
  const rows = S.net;
  if(!rows){ if(!S.busy.net && !S.err.net) setTimeout(loadNet); return h + `<div class="skel">Loading the last 12 months…</div>`; }
  const nets = rows.map(r => Number(r.income) - Number(r.spent));
  const maxP = Math.max(0, ...nets), maxN = Math.max(0, ...nets.map(v => -v));
  const H = 190, pad = 22, scale = (H - 2 * pad) / ((maxP + maxN) || 1), zero = pad + maxP * scale;
  const tot = rows.reduce((a, r) => ({i: a.i + Number(r.income), s: a.s + Number(r.spent)}), {i: 0, s: 0});
  h += `<section class="card" style="padding:18px 0 14px;overflow:hidden" aria-label="Income minus spending, last 12 months"><div class="row sp" style="padding:0 16px"><span class="sm b">Last 12 months</span><span class="xs muted">tap a month</span></div>
    <div class="row xs muted" style="padding:0 16px;gap:14px"><span><i class="key" style="background:var(--gain)"></i>Kept (income above spending)</span><span><i class="key" style="background:var(--loss)"></i>Overspent</span></div>
    <div class="chart"><div class="in" style="width:${rows.length * 52 + 16}px"><div class="nplot"><div class="nzero" style="top:${zero}px"></div>` +
    rows.map((r, i) => {
      const v = nets[i], hgt = Math.max(v ? 2 : 0, Math.round(Math.abs(v) * scale)), sel = r.m === S.month;
      const bar = v >= 0 ? `<i class="g" style="top:${zero - hgt}px;height:${hgt}px"></i><span style="top:${zero - hgt - 15}px">${v ? '+' + short$(v) : '$0'}</span>`
        : `<i class="l" style="top:${zero}px;height:${hgt}px"></i><span style="top:${zero + hgt + 3}px">−${short$(v)}</span>`;
      return `<button class="ncol" data-act="netsel" data-m="${r.m}" aria-pressed="${sel}" aria-label="${esc(mLabel(r.m))}: income ${cad(r.income)}, spent ${cad(r.spent)}, net ${cadS(v)}">${bar}</button>`;
    }).join('') +
    `</div><div class="mlab">${rows.map((r, i) => `<div class="${r.m === S.month ? 'on' : ''}">${mShort(r.m)}<small>${i === 0 || r.m.slice(5, 7) === '01' ? r.m.slice(0, 4) : ''}</small></div>`).join('')}</div></div></div>
    <div class="row sp sm" style="padding:0 16px"><span class="muted">12 months: ${cad0(tot.i)} in, ${cad0(tot.s)} out</span><span class="b" style="white-space:nowrap">${tot.i - tot.s >= 0 ? '+' : '−'}${cad0(Math.abs(tot.i - tot.s))}</span></div></section>`;
  h += `<section class="card tight"><table class="ntable"><caption class="sm b" style="text-align:left;padding:10px 0 4px">Month by month</caption><thead><tr><th scope="col">Month</th><th scope="col">Income</th><th scope="col">Spent</th><th scope="col">Net</th></tr></thead><tbody>` +
    rows.slice().reverse().map(r => { const v = Number(r.income) - Number(r.spent); return `<tr class="${r.m === S.month ? 'on' : ''}"><td>${mShort(r.m)} ${r.m.slice(0, 4)}</td><td>${cad0(r.income)}</td><td>${cad0(r.spent)}</td><td class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : '−'}${cad0(Math.abs(v))}</td></tr>`; }).join('') +
    `</tbody></table></section>`;
  return h;
}
const loadNet = () => load('net', async () => { S.netScrolled = false; S.net = await api('app_net', {end: monthOf(todayISO())}); });

/* ---- category history ---- */
function viewCat(){
  const c = S.cat; const name = topName(c.cid);
  let h = `<main>${hdr(name, c.kind === 'income' ? 'Income' : 'Spending', null, true)}`;
  const tops = B().cats.filter(x => !x.pid && x.kind === c.kind).sort((a, b) => a.name.localeCompare(b.name));
  h += `<div class="chips" role="group" aria-label="Category">${tops.map(t => `<button class="chip" data-act="catsw" data-cid="${t.id}" aria-pressed="${t.id === c.cid}">${esc(t.name)}</button>`).join('')}</div>`;
  if(S.err.cat) h += banner(S.err.cat, true);
  if(!c.rows) return h + `<div class="skel">Loading history…</div></main>`;
  const months = []; for(let i = 11; i >= 0; i--) months.push(addMonths(c.end, -i));
  const tot = {}; const bySub = {};
  for(const r of c.rows){ tot[r.m] = (tot[r.m] || 0) + Number(r.amt); if(r.m === c.sel){ bySub[r.sub] = (bySub[r.sub] || 0) + Number(r.amt); } }
  const vals = months.map(m => tot[m] || 0); const avg = vals.reduce((a, b) => a + b, 0) / 12;
  const max = Math.max(1, ...vals) * 1.18; const H = 150;
  const si = months.indexOf(c.sel); const cur = tot[c.sel] || 0; const prev = si > 0 ? vals[si - 1] : null;
  h += `<div class="row sp"><button class="icon-btn" data-act="catm" data-d="-1" aria-label="Previous month"${si <= 0 ? ' disabled' : ''}>${svg('left', 18)}</button><span class="b">${esc(mLabel(c.sel))}</span><button class="icon-btn" data-act="catm" data-d="1" aria-label="Next month"${si >= 11 ? ' disabled' : ''}>${svg('right', 18)}</button></div>`;
  h += `<section class="card" style="padding:18px 0 14px;overflow:hidden" aria-label="Monthly totals, last 12 months"><div class="row sp" style="padding:0 16px"><span class="sm b">Last 12 months</span><span class="xs muted">swipe for earlier · tap a month</span></div>
    <div class="chart"><div class="in" style="width:${12 * 52 + 16}px"><div class="plot"><div class="avg" style="bottom:${Math.round(avg / max * H)}px"></div>` +
    months.map((m, i) => `<button class="col" data-act="catsel" data-m="${m}" aria-pressed="${m === c.sel}" aria-label="${esc(mLabel(m))}: ${cad(vals[i])}"><span>${vals[i] ? short$(vals[i]) : ''}</span><i style="height:${Math.max(vals[i] ? 2 : 0, Math.round(vals[i] / max * H))}px"></i></button>`).join('') +
    `</div><div class="mlab">${months.map((m, i) => `<div class="${m === c.sel ? 'on' : ''}">${mShort(m)}<small>${i === 0 || m.slice(5, 7) === '01' ? m.slice(0, 4) : ''}</small></div>`).join('')}</div></div></div>
    <div class="row xs muted" style="padding:0 16px"><span aria-hidden="true" style="width:18px;border-top:1.5px dashed var(--avg)"></span><span>12-month average ${cad(avg)}</span></div></section>`;
  const dstyle = v => c.kind === 'income' ? (v >= 0 ? 'pos' : 'neg') : (v > 0 ? 'neg' : 'pos');
  h += `<section class="tiles" style="gap:8px"><div class="mtile"><span class="k">${mShort(c.sel)} total</span><span class="v">${cad(cur)}</span></div>
    <div class="mtile"><span class="k">vs ${prev == null ? 'earlier' : mShort(months[si - 1])}</span><span class="v ${prev == null ? '' : dstyle(cur - prev)}">${prev == null ? '—' : cadS(cur - prev)}</span>${prev ? `<span class="xs muted">${(cur - prev >= 0 ? '+' : '−') + Math.abs((cur - prev) / prev * 100).toFixed(1)}%</span>` : ''}</div>
    <div class="mtile"><span class="k">vs 12-mo avg</span><span class="v ${dstyle(cur - avg)}">${cadS(cur - avg)}</span></div></section>`;
  if(c.kind === 'expense'){

/* ---- budgets ---- */
function viewBudgets(){

  if(!md) return h + `<div class="skel">Loading…</div></main>`;
  const bs = budgetSummary(md); const spent = {}; (md.exp || []).forEach(x => { spent[x.cid] = Number(x.amt); });
  const avg = {}; (md.avg3 || []).forEach(x => { avg[x.cid] = Number(x.amt); });
  const bud = {}; (md.budgets || []).forEach(b => { bud[b.cid] = Number(b.amount); });
  if(bs){
    const pct = bs.limit ? Math.round(bs.spent / bs.limit * 100) : 0; const dl = daysLeft(S.month); const left = bs.limit - bs.spent;
    h += `<section class="hero"><span class="lbl">Spent in budgeted categories, of ${cad(bs.limit)}</span><span class="big">${cad(bs.spent)}</span><div class="bar lg"><i class="${pct > 100 ? 'over' : ''}" style="width:${Math.min(pct, 100)}%"></i></div>
      <div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="tile" style="cursor:default"><span class="k">${left >= 0 ? 'Left to spend' : 'Over budget'}</span><span class="v${left < 0 ? ' owed' : ''}">${cad(Math.abs(left))}</span></div><div class="tile" style="cursor:default"><span class="k">${dl ? 'Safe per day' : 'Days left'}</span><span class="v">${dl ? cad(Math.max(0, left) / dl) : '0'}</span></div></div></section>`;
  } else h += banner('Set a monthly limit for any category. A limit carries forward to later months until you change it.');
  const tops = B().cats.filter(c => !c.pid && c.kind === 'expense');
  const withB = tops.filter(c => bud[c.id] != null).sort((a, b) => (spent[b.id] || 0) - (spent[a.id] || 0));
  const without = tops.filter(c => bud[c.id] == null && (spent[c.id] || avg[c.id])).sort((a, b) => ((spent[b.id] || 0) + (avg[b.id] || 0)) - ((spent[a.id] || 0) + (avg[a.id] || 0)));
  const row = (c, has) => {
    const s = spent[c.id] || 0; const lim = bud[c.id]; const editing = S.budgetEdit && S.budgetEdit.cid === c.id;
    let r = `<div class="review" style="gap:6px">`;

      const pct = lim ? Math.round(s / lim * 100) : 0; const over = s > lim;
      r += `<button data-act="budedit" data-cid="${c.id}" style="border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:inherit"><span class="row" style="gap:8px;width:100%"><span class="b grow">${esc(c.name)}</span><span class="b">${cad(s)}</span><span class="xs muted">/ ${cad(lim)}</span></span><span class="bar" style="width:100%"><i class="${over ? 'over' : ''}" style="width:${Math.min(pct, 100)}%"></i></span><span class="row sp xs" style="width:100%">${over ? `<span class="neg b row" style="gap:4px">${svg('alert', 14)}${cad(s - lim)} over</span>` : `<span class="sb" style="color:var(--ink2)">${cad(lim - s)} left</span>`}<span class="muted">${pct}%</span></span></button>`;
    } else {
      r += `<div class="row" style="gap:8px"><span class="b grow">${esc(c.name)}</span><span class="sm">${cad(s)} this month</span></div><div class="row sp xs muted"><span>3-month average ${cad(avg[c.id] || 0)}</span><button class="link" data-act="budedit" data-cid="${c.id}">Set budget</button></div>`;
    }
    if(editing){
      r += `<form class="row" data-form="budget" style="gap:8px"><label class="grow"><span class="xs muted b">Monthly limit</span><input id="bud-amt" class="inp" inputmode="decimal" value="${esc(S.budgetEdit.v)}" aria-label="Monthly limit for ${esc(c.name)}"></label><button class="btn accent" type="submit" style="align-self:flex-end"${S.busy.budget ? ' disabled' : ''}>Save</button><button class="btn" type="button" data-act="budcancel" style="align-self:flex-end">Cancel</button></form>`;
      if(has) r += `<button class="link" data-act="budremove" style="align-self:flex-start;color:var(--warn)">Remove this budget from ${esc(mLabel(S.month))} on</button>`;
    }
    return r + `</div>`;
  };
  if(withB.length) h += `<section class="card tight"><div class="row sp" style="padding-top:10px"><h2>Budgeted</h2><span class="xs muted">tap to change</span></div><div class="list">${withB.map(c => row(c, true)).join('')}</div></section>`;
  if(without.length) h += `<section class="card tight"><div class="row sp" style="padding-top:10px"><h2>No budget yet</h2></div><div class="list">${without.map(c => row(c, false)).join('')}</div></section>`;
  return h + `</main>`;
}

function reviewRow(r, i){
  const signed = r.dir === 'in' ? r.amount : -r.amount;
  let badges = '';
  if(r.exact) badges += '<span class="badge good">Already saved</span>';
  else if(r.dups.length) badges += `<span class="badge warn">Possible duplicate: ${esc(r.dups[0].payee || 'a saved transaction')} on ${esc(r.dups[0].d)}</span>`;
  if(!r.exact) badges += r.csrc === 'rule' ? '<span class="badge">Your rule</span>' : (r.cat ? `<span class="badge">Claude suggests${r.conf != null ? ' · ' + Math.round(r.conf * 100) + '%' : ''}</span>` : '<span class="badge warn">Pick a category</span>');
  if(r.pending) badges += '<span class="badge j">Pending</span>';
  let h = `<div class="review"${r.exact ? ' style="opacity:.6"' : ''}><div class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" class="check" id="imp-on-${i}" data-i="${i}"${r.on && !r.exact ? ' checked' : ''}${r.exact ? ' disabled' : ''} aria-label="Save ${esc(r.payee || r.description)}">
    <label for="imp-on-${i}" class="grow" style="min-width:0"><span class="t1" style="display:block;white-space:normal">${esc(r.payee || r.description)}</span><span class="t2" style="display:block;white-space:normal">${esc(r.date)} · ${esc(r.description)}</span></label><span class="amt${signed > 0 ? ' pos' : ''}">${cadS(signed)}</span></div>
    <div class="row wrap" style="gap:6px">${badges}</div>`;
  if(!r.exact){
    h += `<div class="row wrap" style="gap:8px"><select id="imp-kind-${i}" data-i="${i}" aria-label="Type"><option value="expense"${r.kind === 'expense' ? ' selected' : ''}>Expense</option><option value="income"${r.kind === 'income' ? ' selected' : ''}>Income</option><option value="transfer"${r.kind === 'transfer' ? ' selected' : ''}>Transfer</option></select>`;
    h += r.kind === 'transfer' ? `<select id="imp-to-${i}" data-i="${i}" aria-label="Other account" style="flex:1"><option value="">${r.dir === 'in' ? 'From which account?' : 'To which account?'}</option>${acctOptions(r.to, x => x.id !== S.imp.acct)}</select>`
      : `<select id="imp-cat-${i}" data-i="${i}" aria-label="Category" style="flex:1">${catOptions(r.kind, r.cat, true)}</select>`;
    h += `</div>`;
  }
  return h + `</div>`;
}

/* ---------- actions ---------- */
async function setMonth(m){ S.month = m; render(); if(!S.monthData[m]) await loadMonth(m); }
function startAdd(){
  const def = store('lastAcct');
  S.add = {kind: 'expense', amt: '', acct: acct(def) ? def : (B().accounts.find(a => a.active && a.type === 'credit_card') || B().accounts[0] || {}).id, to: '', cat: '', date: todayISO(), payee: '', note: ''};
  delete S.err.add; go('add', true);
}
async function saveAdd(){
  const a = S.add; delete S.err.add;
  try {
    const amt = Math.abs(Number(String(a.amt).replace(/[$,\s]/g, '')));
    if(!amt) throw {code: 'bad_input', message: 'Enter an amount.'};
    if(a.kind === 'transfer' && !a.to) throw {code: 'bad_input', message: 'Choose the account the money went to.'};
    S.busy.add = true; render();
    D(a.date);
    await api('app_add_txn', {kind: a.kind, amount: amt, acct: a.acct, to: a.kind === 'transfer' ? a.to : null, cat: a.kind === 'transfer' ? null : (a.cat || null), date: a.date, payee: a.payee, note: a.note}, true);
    store('lastAcct', a.acct);
    S.busy.add = false; S.monthData = {}; back(); toast('Saved');
    refreshAll();
  } catch(e){ S.busy.add = false; S.err.add = errText(e); render(); }
}
function openEdit(id){
  const all = [...(S.recent || []), ...(S.txns || []), ...((S.cat && S.cat.tx) || [])];
  const t = all.find(x => x.id === id); if(!t) return;
  delete S.err.edit;
  S.sheet = {type: 'edit', t, cat: t.cid || '', payee: t.payee || '', note: t.note || '', confirmDelete: false}; render();
}
async function saveEdit(){
  const s = S.sheet; const t = s.t; delete S.err.edit;
  try {
    S.busy.edit = true; render();
    await api('app_update_txn', {id: t.id, note: s.note, payee: s.payee, cat: s.cat || null}, true);
    S.busy.edit = false; S.sheet = null; toast('Saved'); afterWrite();
  } catch(e){ S.busy.edit = false; S.err.edit = errText(e); render(); }
}
async function deleteTx(){
  const t = S.sheet.t;
  try {
    S.busy.edit = true; render();
    await api('app_delete_txn', {id: t.id}, true);
    S.busy.edit = false; S.sheet = null; toast('Deleted'); afterWrite();
  } catch(e){ S.busy.edit = false; S.err.edit = errText(e); render(); }
}
function afterWrite(){

  if(S.view === 'txns') loadTxns();

}
async function saveBudget(){

  render();
  try { await api('app_set_net_worth', {ids, on}, true); }
  catch(e){ B().accounts.forEach(a => { if(a.id in prev) a.nw = prev[a.id]; }); S.err.nw = 'Not saved. ' + errText(e); render(); }
}

/* ---- screenshot import ---- */
function startImport(){
  S.imp = {step: 'pick', acct: store('impAcct') || '', files: [], rows: [], error: null, ctl: null};
  if(!acct(S.imp.acct)) S.imp.acct = '';
  go('imp', true);
}
function catPathMap(){
  const m = {}; for(const c of B().cats){ const p = c.pid && cat(c.pid); m[(c.kind === 'income' ? 'Income: ' : '') + (p ? p.name + ' / ' + c.name : c.name)] = c.id; }
  return m;
}
async function readScreens(){
  const im = S.imp; const a = acct(im.acct); if(!a || !im.files.length) return;
  im.step = 'reading'; im.error = null; im.status = null; im.ctl = new AbortController(); render();
  const paths = Object.keys(catPathMap());
  const prompt = `These are screenshots of the transaction list for one account: "${a.name}" (${a.type.replace(/_/g, ' ')}${a.institution ? ', ' + a.institution : ''}). Today is ${todayISO()} in Toronto, Canada. Amounts are Canadian dollars.

Extract every transaction row you can fully read. Skip balances, headers, totals, and rows cut off so the date or amount is unreadable. Do not invent rows.

For each transaction give:
- "date": YYYY-MM-DD. If the year is not shown, use the most recent such date on or before today.
- "description": the transaction text exactly as shown.
- "payee": a short clean merchant or payer name, e.g. "Tim Hortons".
- "amount": a positive number.
- "direction": "out" if money left this account (purchase, bill, withdrawal, fee, e-transfer sent), "in" if money came in (deposit, salary, refund, a payment received on a credit card).
- "pending": true if the row is marked pending, else false.
- "kind": "transfer" when the money moves between the household's own accounts (a credit card payment, a transfer to savings, TFSA, RRSP or another of their accounts); "income" for money received from outside; otherwise "expense".
- "category": for expenses and income, the best matching category from the list below, copied exactly; "" if none fits or for transfers.
- "confidence": your confidence in the category from 0 to 1.

Categories (income ones start with "Income: "):
${paths.join('\n')}

Reply with only a JSON array of these objects, in the order they appear.`;
  let out;
  try {
    out = S.web ? await readScreensWeb(prompt, im.files.slice(0, S.imgMax), im.ctl.signal)
      : await S.sample.json(prompt, {images: im.files.slice(0, S.imgMax), signal: im.ctl.signal, modelTier: 'default', onText: () => { if(im.status !== 'Writing out the transactions…'){ im.status = 'Writing out the transactions…'; render(); } }});
  } catch(e){
    im.step = 'pick';
    im.error = e.code === 'cancelled' ? null : ({no_api_key: 'Reading screenshots isn’t switched on yet. It needs an Anthropic API key added to the Supabase project (see the app’s README). Until then, use the Claude version of the app for screenshots.', bad_api_key: 'The Anthropic API key saved in Supabase was refused. Check it in the Supabase dashboard.', not_a_member: 'Your login isn’t part of the household.', decode: 'One of the images couldn’t be opened here. Use PNG or JPEG screenshots.', not_granted: 'Claude wasn’t allowed to read screenshots in this app. Reload and choose Allow to use this.', rate_limited: 'Too many requests right now. Wait a minute and try again.', image_rejected: 'One of the images couldn’t be read. Use PNG or JPEG screenshots.', invalid_json: 'Claude’s answer couldn’t be read. Try again, or use fewer screenshots at once.', refused: 'Claude couldn’t read these screenshots. Try clearer or fewer screenshots.'}[e.code] || 'Reading failed. Try again.');
    return render();
  }
  if(!Array.isArray(out) || !out.length){ im.step = 'pick'; im.error = 'No transactions were found in these screenshots.'; return render(); }
  const cmap = catPathMap();
  const rows = out.map(r => ({
    date: String(r.date || '').slice(0, 10), description: String(r.description || r.payee || '').slice(0, 300), payee: String(r.payee || '').slice(0, 120),
    amount: Math.abs(Number(r.amount) || 0), dir: r.direction === 'in' ? 'in' : 'out', pending: !!r.pending,
    kind: ['expense','income','transfer'].includes(r.kind) ? r.kind : (r.direction === 'in' ? 'income' : 'expense'),
    cat: cmap[String(r.category || '')] || cmap['Income: ' + String(r.category || '')] || '', conf: r.confidence != null ? Number(r.confidence) : null, csrc: 'ai',
    to: '', exact: false, dups: [], on: true
  })).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date) && r.amount > 0);
  const seen = {}; rows.forEach(r => { const k = r.date + '|' + r.dir + r.amount + '|' + r.description.toLowerCase().replace(/[^a-z&]+/g, ' ').trim(); r.occ = seen[k] = (seen[k] || 0) + 1; });
  im.status = 'Checking for duplicates and categories…'; render();
  try {
    const payload = rows.map((r, i) => ({i, d: r.date, descr: r.description, amt: r.dir === 'in' ? r.amount : -r.amount, occ: r.occ}));
    const res = await api('app_import_check', {acct: a.id, rows: payload});
    for(const x of res || []){
      const r = rows[x.i]; if(!r) continue;
      r.exact = !!x.exact; r.dups = x.dups || [];
      if(x.rule && (x.rule.category_id || x.rule.kind)){
        if(x.rule.kind) r.kind = x.rule.kind;
        if(x.rule.category_id){ const rc = cat(x.rule.category_id); if(rc && rc.kind === r.kind){ r.cat = x.rule.category_id; r.csrc = 'rule'; r.conf = 1; } }
        if(x.rule.payee_rename) r.payee = x.rule.payee_rename;
      }
      if(r.exact || r.dups.length) r.on = false;
    }
  } catch(e){ im.step = 'pick'; im.error = 'Couldn’t check for duplicates: ' + errText(e); return render(); }
  rows.forEach(r => { if(r.cat && cat(r.cat) && cat(r.cat).kind !== r.kind) r.cat = ''; });
  im.rows = rows; im.step = 'review'; im.status = null; render();
}
async function saveImport(){
  const im = S.imp; const a = acct(im.acct); im.error = null;
  const chosen = im.rows.filter(r => r.on && !r.exact);
  const missing = chosen.find(r => r.kind === 'transfer' && !r.to);
  if(missing){ im.error = 'Choose the other account for each transfer, or change its type.'; return render(); }
  const data = chosen.map(r => ({
    d: r.date, descr: r.description, payee: r.payee || null, amt: r.dir === 'in' ? r.amount : -r.amount, occ: r.occ,
    kind: r.kind, cat: r.kind === 'transfer' ? null : (r.cat || null), csrc: r.kind === 'transfer' || !r.cat ? null : r.csrc,
    conf: r.kind === 'transfer' || !r.cat ? null : (r.conf == null ? null : Math.max(0, Math.min(1, r.conf))), pending: r.pending,
    to: r.kind === 'transfer' ? r.to : null, grp: r.kind === 'transfer' ? newId() : null
  }));
  data.forEach(x => { if(x.cat) U(x.cat); if(x.to) U(x.to); if(x.grp) U(x.grp); D(x.d); N(x.amt); });
  const dupCount = im.rows.length - chosen.length;
  im.saving = true; render();
  try {
    const res = await api('app_import_save', {acct: a.id, label: im.files.length + ' screenshot(s)', row_count: im.rows.length, dup_count: dupCount, rows: data}, true);
    store('impAcct', im.acct);
    im.saving = false; im.step = 'done';
    const n = res ? Number(res.saved) : chosen.length;
    im.done = `Saved ${n} transaction${n === 1 ? '' : 's'} to ${a.name}.` + (chosen.length - n > 0 ? ` ${chosen.length - n} were already saved and were skipped.` : '');
    S.monthData = {}; refreshAll(); render();
  } catch(e){ im.saving = false; im.error = 'Not saved. ' + errText(e); render(); }
}

// Shrinks each screenshot to what Claude reads anyway (long side 1568 px) and sends them to the
// read-screenshots function, which returns Claude's answer as text.
async function shrink(file){
  let bmp;
  try { bmp = await createImageBitmap(file); } catch(e){ throw {code: 'decode'}; }
  const k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return {type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.9).split(',')[1]};
}
async function readScreensWeb(prompt, files, signal){
  const images = await Promise.all(files.map(shrink));
  S.imp.status = 'Claude is reading the transactions. This usually takes 20–60 seconds.'; render();
  const cancelled = new Promise((_, rej) => signal.addEventListener('abort', () => rej({code: 'cancelled'})));
  const {data, error} = await Promise.race([S.sb.functions.invoke('read-screenshots', {body: {prompt, images}}), cancelled]);
  if(error){
    let code = 'failed';
    try { const b = await error.context.json(); code = b.error || code; } catch(e){}
    throw {code: {image_rejected: 'image_rejected', rate_limited: 'rate_limited', refused: 'refused'}[code] || code};
  }
  const text = String((data && data.text) || '');
  const i = text.indexOf('['), j = text.lastIndexOf(']');
  if(i < 0 || j < i) throw {code: 'invalid_json'};
  try { return JSON.parse(text.slice(i, j + 1)); } catch(e){ throw {code: 'invalid_json'}; }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  if(act === 'closesheet' && e.target.closest('[data-stop]') && el.classList.contains('sheet-bg')) return;
  switch(act){
    case 'tab': S.stack = []; go(el.dataset.v); break;
    case 'back': back(); break;
    case 'reload': S.monthData = {}; if(S.unlinked && S.web){ api('app_claim').catch(() => {}).then(refreshAll); } else refreshAll(); break;
    case 'loginmode': S.login.mode = S.login.mode === 'up' ? 'in' : 'up'; S.login.err = null; S.login.msg = null; render(); break;
    case 'signout': signOut(); break;
    case 'people': openPeople(); break;
    case 'linklogin': linkLogin(el.dataset.uid, el.dataset.mid); break;
    case 'thismonth': setMonth(monthOf(todayISO())); break;
    case 'month': setMonth(addMonths(S.month, +el.dataset.d)); break;
    case 'owner': S.owner = el.dataset.v; render(); break;
    case 'hidden': S.showHidden = !S.showHidden; render(); break;
    case 'countall': S.countAll = !S.countAll; store('countAll', S.countAll); render(); break;
    case 'nweye': { const a = acct(el.dataset.id); if(a) setNetWorth([a.id], !a.nw); break; }
    case 'inskind': S.insKind = el.dataset.v; render(); break;
    case 'netsel': setMonth(el.dataset.m); break;
    case 'cat': if(el.dataset.cid) openCat(el.dataset.cid, el.dataset.k); break;
    case 'catsw': S.cat.cid = el.dataset.cid; S.cat.rows = null; S.cat.tx = null; S.cat.scrolled = false; render(); loadCat(); break;
    case 'catsel': S.cat.sel = el.dataset.m; S.cat.tx = null; render(); loadCatTx(); if(!S.monthData[S.cat.sel]) loadMonth(S.cat.sel); break;
    case 'catm': { const ms = []; for(let i = 11; i >= 0; i--) ms.push(addMonths(S.cat.end, -i)); const i = ms.indexOf(S.cat.sel) + (+el.dataset.d); if(ms[i]){ S.cat.sel = ms[i]; S.cat.tx = null; S.cat.scrolled = false; render(); loadCatTx(); } break; }
    case 'alltx': openTxns(); break;
    case 'review': openTxns({txReview: true}); break;
    case 'acct': openTxns({txAcct: el.dataset.id}); break;
    case 'txkind': S.txKind = el.dataset.v; S.txns = null; render(); loadTxns(); break;
    case 'txm': S.txMonth = addMonths(S.txMonth, +el.dataset.d); S.txns = null; render(); loadTxns(); break;
    case 'edit': openEdit(el.dataset.id); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'delask': S.sheet.confirmDelete = true; render(); break;
    case 'delno': S.sheet.confirmDelete = false; render(); break;
    case 'deldo': deleteTx(); break;
    case 'addmenu': S.sheet = {type: 'addmenu'}; render(); break;
    case 'openadd': startAdd(); break;
    case 'openimp': startImport(); break;
    case 'addkind': S.add.kind = el.dataset.v; S.add.cat = ''; render(); break;
    case 'budedit': { const md = S.monthData[S.month] || {}; const b = (md.budgets || []).find(x => x.cid === el.dataset.cid); const avg = (md.avg3 || []).find(x => x.cid === el.dataset.cid); S.budgetEdit = {cid: el.dataset.cid, v: b ? String(Number(b.amount)) : (avg ? String(Math.round(Number(avg.amt))) : '')}; render(); const i = $('#bud-amt'); if(i) i.focus(); break; }
    case 'budcancel': S.budgetEdit = null; render(); break;
    case 'budremove': removeBudget(); break;
    case 'impread': readScreens(); break;
    case 'impstop': if(S.imp.ctl) S.imp.ctl.abort(); break;
    case 'impsave': saveImport(); break;
    case 'impreset': case 'impagain': S.imp = {step: 'pick', acct: S.imp.acct, files: [], rows: [], error: null}; render(); break;
    case 'impview': openTxns({txAcct: S.imp.acct}); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if(f === 'login') doLogin(); else if(f === 'add') saveAdd(); else if(f === 'edit') saveEdit(); else if(f === 'budget') saveBudget();
});
let searchT;
document.addEventListener('input', e => {
  const t = e.target; const id = t.id || '';
  if(id === 'login-email' && S.login){ S.login.email = t.value; return; }
  if(id === 'login-pw' && S.login){ S.login.pw = t.value; return; }
  if(id === 'txq'){ S.txq = t.value; clearTimeout(searchT); searchT = setTimeout(() => { S.txns = null; render(); loadTxns(); }, 450); return; }
  if(id.startsWith('add-') && S.add){ const k = {'add-amt':'amt','add-date':'date','add-payee':'payee','add-note':'note'}[id]; if(k) S.add[k] = t.value; return; }
  if(id.startsWith('ed-') && S.sheet){ const k = {'ed-payee':'payee','ed-note':'note'}[id]; if(k) S.sheet[k] = t.value; return; }
  if(id === 'bud-amt' && S.budgetEdit){ S.budgetEdit.v = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target; const id = t.id || '';
  if(id === 'txacct'){ S.txAcct = t.value; S.txns = null; render(); loadTxns(); }
  else if(id === 'add-acct'){ S.add.acct = t.value; if(S.add.to === t.value) S.add.to = ''; render(); }
  else if(id === 'add-to'){ S.add.to = t.value; }
  else if(id === 'add-cat'){ S.add.cat = t.value; }
  else if(id === 'ed-cat'){ S.sheet.cat = t.value; }
  else if(id === 'imp-acct'){ S.imp.acct = t.value; render(); }
  else if(id === 'imp-files'){ S.imp.files = Array.from(t.files || []); render(); }
  else if(id.startsWith('imp-on-')){ S.imp.rows[+t.dataset.i].on = t.checked; render(); }
  else if(id.startsWith('imp-kind-')){ const r = S.imp.rows[+t.dataset.i]; r.kind = t.value; if(r.cat && cat(r.cat) && cat(r.cat).kind !== r.kind) r.cat = ''; render(); }
  else if(id.startsWith('imp-cat-')){ const r = S.imp.rows[+t.dataset.i]; r.cat = t.value; r.csrc = 'manual'; r.conf = null; render(); }
  else if(id.startsWith('imp-to-')){ S.imp.rows[+t.dataset.i].to = t.value; render(); }
});

/* ---------- boot ---------- */
async function boot(){
  S.month = monthOf(todayISO()); S.txMonth = S.month; S.countAll = !!store('countAll');
  render();
  if(!window.claude || !window.claude.use) return bootWeb();
  const [mcp, sample] = await Promise.all(['mcp', 'sample'].map(n => window.claude.use(n).catch(() => null)));
  S.mcp = mcp; S.sample = sample;
  if(sample && sample.limits){
    const lim = await sample.limits().catch(() => null);
    S.imgOK = !!(lim && lim.images); S.imgMax = (lim && lim.images && lim.images.maxCount) || 5;
    S.imgTypes = (lim && lim.images && lim.images.mediaTypes || ['image/png', 'image/jpeg']).join(',');
  }
  if(!mcp){ S.noRuntime = true; return render(); }
  refreshAll();
}
// Outside Claude: sign in to Supabase and read screenshots through the read-screenshots function.
async function bootWeb(){
  S.web = true; S.imgOK = true; S.imgMax = 5; S.imgTypes = 'image/png,image/jpeg,image/webp,image/heic,image/heif';
  S.login = {mode: 'in', email: store('email') || '', pw: '', err: null, msg: null, busy: false};
  try {
    const m = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    S.sb = m.createClient(CFG.url, CFG.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  } catch(e){ S.fatal = 'The app couldn’t load. Check your connection and reload the page.'; return render(); }
  S.sb.auth.onAuthStateChange((ev, session) => {
    if(ev === 'SIGNED_OUT' && S.user){ Object.assign(S, {user: null, boot: null, monthData: {}, unlinked: false, sheet: null}); render(); }
    else if(session && S.user) S.user = session.user;
  });
  const {data} = await S.sb.auth.getSession();
  S.authReady = true;
  if(data && data.session) await signedIn(data.session.user); else render();
}
boot();
})();
