<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add transaction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2ED;font-family:Manrope,system-ui,sans-serif;color:#15171A;font-variant-numeric:tabular-nums}
a{color:#1D5FB4}a:hover{color:#154A8C}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 20px 16px 24px; background: #F4F2ED; font-family: Manrope, system-ui, sans-serif; color: #15171A">

<header style="display: flex; align-items: center; justify-content: space-between; min-height: 52px">
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Cancel</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">New transaction</h1>
<span style="width: 52px"></span>
</header>

<div role="tablist" aria-label="Type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E8E5DE">
<sc-for list="{{types}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<label style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 8px">
<span style="font-size: 13px; color: #5B5F64; font-weight: 600">Amount</span>
<span style="display: flex; align-items: baseline; gap: 4px; font-family: Fraunces, Georgia, serif; font-size: 48px; font-weight: 500">₹<input inputmode="decimal" value="486" aria-label="Amount in rupees" style="width: 160px; border: 0; outline: none; background: transparent; font: 500 48px Fraunces, Georgia, serif; color: #15171A; text-align: left"></span>
</label>

<sc-if value="{{showCategories}}" hint-placeholder-val="{{ true }}">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0 0 10px; font-size: 13px; color: #5B5F64; font-weight: 700">Category</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{categories}}" as="c" hint-placeholder-count="9">
<button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</fieldset>
</sc-if>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0 0 10px; font-size: 13px; color: #5B5F64; font-weight: 700">{{accountLabel}}</legend>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="6">
<button aria-pressed="{{a.on}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF">
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; font-size: 14px">
<span style="font-weight: 700">Date</span>
<input type="date" value="2026-09-26" style="border: 0; background: transparent; font: 600 14px Manrope, sans-serif; color: #15171A">
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-top: 1px solid #EFEDE7; font-size: 14px">
<span style="font-weight: 700">Note</span>
<input type="text" placeholder="Swiggy, dinner" style="flex-grow: 1; border: 0; outline: none; background: transparent; font: 500 14px Manrope, sans-serif; color: #15171A; text-align: right">
</label>
</div>

<div style="flex-grow: 1"></div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #15171A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Save</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { type: 'expense', category: 'Dining', account: 'ICICI card', to: 'HDFC Savings' };
}
renderVals() {
var s = this.state;
var pill = function (on) { return 'min-height: 44px; padding: 0 14px; border-radius: 12px; font: 700 13px Manrope, sans-serif; ' + (on ? 'border: 1.5px solid #1D5FB4; background: #E4EDF8; color: #154A8C' : 'border: 1px solid #E3E0D8; background: #FFFFFF; color: #15171A'); };
var tab = function (on) { return 'min-height: 44px; border-radius: 10px; border: 0; font: 700 14px Manrope, sans-serif; color: ' + (on ? '#15171A' : '#5B5F64') + '; background: ' + (on ? '#FFFFFF' : 'transparent'); };
var cats = s.type === 'income' ? ['Salary', 'Freelance', 'Interest', 'Refund', 'Gift', 'Other'] : ['Rent', 'Groceries', 'Dining', 'Transport', 'Shopping', 'Bills', 'Health', 'Fun', 'Others'];
var accts = ['HDFC Savings', 'SBI Salary', 'ICICI Savings', 'Cash', 'HDFC card', 'ICICI card'];
return {
types: [['expense', 'Expense'], ['income', 'Income'], ['transfer', 'Transfer']].map((t) => ({
label: t[1], on: s.type === t[0], style: tab(s.type === t[0]),
pick: () => this.setState({ type: t[0], category: t[0] === 'income' ? 'Salary' : 'Dining' })
})),
showCategories: s.type !== 'transfer',
categories: cats.map((c) => ({ label: c, on: s.category === c, style: pill(s.category === c), pick: () => this.setState({ category: c }) })),
accountLabel: s.type === 'transfer' ? 'From account' : (s.type === 'income' ? 'Received in' : 'Paid from'),
accounts: accts.map((a) => ({ label: a, on: s.account === a, style: pill(s.account === a), pick: () => this.setState({ account: a }) }))
};
}
}
</script>
</body>
</html>
