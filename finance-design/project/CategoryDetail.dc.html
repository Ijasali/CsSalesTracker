<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<title>Category history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1220px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; background: #F4F2ED; font-family: Manrope, system-ui, sans-serif; color: #15171A; font-variant-numeric: tabular-nums">

<header style="display: flex; align-items: center; gap: 8px; min-height: 52px">
<sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}">
<button onClick="{{back}}" aria-label="Back to all categories" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #E3E0D8; background: #FFFFFF; color: #15171A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
</sc-if>
<sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}">
<a href="Spending.dc.html" aria-label="Back to all categories" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #E3E0D8; background: #FFFFFF; color: #15171A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
</sc-if>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600">{{name}}</h1>
</header>

<div role="tablist" aria-label="Category" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="9">
<button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<button onClick="{{prev}}" disabled="{{atStart}}" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3E0D8; background: #FFFFFF; color: #15171A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<span style="font-size: 16px; font-weight: 700">{{monthLabel}}</span>
<button onClick="{{next}}" disabled="{{atEnd}}" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3E0D8; background: #FFFFFF; color: #15171A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>

<section aria-label="Monthly spending, last 6 months" style="display: flex; flex-direction: column; gap: 10px; padding: 18px 16px 14px; border-radius: 20px; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 13px; font-weight: 700">Last 6 months</span>
<span style="font-size: 12px; color: #5B5F64">tap a month</span>
</div>
<div style="position: relative; height: 180px; border-bottom: 1px solid #D9D5CC">
<div style="{{avgLineStyle}}"><span style="position: absolute; right: 0; top: -18px; font-size: 11px; font-weight: 700; color: #5B5F64; background: #FFFFFF; padding: 0 4px">avg {{avg}}</span></div>
<div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: end">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<button onClick="{{b.pick}}" aria-label="{{b.aria}}" aria-pressed="{{b.on}}" style="height: 180px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; cursor: pointer">
<span style="{{b.labelStyle}}">{{b.short}}</span>
<span style="{{b.barStyle}}"></span>
</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<span style="{{b.monthStyle}}">{{b.month}}</span>
</sc-for>
</div>
</section>

<section aria-label="Comparison" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; background: #FFFFFF">
<span style="font-size: 11px; color: #5B5F64; font-weight: 700">{{monthShort}} total</span>
<span style="font-size: 14px; font-weight: 700">{{total}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; background: #FFFFFF">
<span style="font-size: 11px; color: #5B5F64; font-weight: 700">vs {{prevShort}}</span>
<span style="{{deltaStyle}}">{{delta}}</span>
<span style="font-size: 11px; color: #5B5F64">{{deltaPct}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; background: #FFFFFF">
<span style="font-size: 11px; color: #5B5F64; font-weight: 700">vs 6-mo avg</span>
<span style="{{avgDeltaStyle}}">{{avgDelta}}</span>
<span style="font-size: 11px; color: #5B5F64">avg {{avg}}</span>
</div>
</section>

<sc-if value="{{isCurrent}}" hint-placeholder-val="{{ true }}">
<a href="Budgets.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; color: #15171A; text-decoration: none; font-size: 13px">
<span style="font-weight: 700">Budget {{budget}}</span>
<span style="{{budgetStyle}}">{{budgetLeft}}</span>
</a>
</sc-if>

<section aria-label="Breakdown" style="display: flex; flex-direction: column; padding: 8px 16px; border-radius: 20px; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0 6px; font-size: 13px; color: #5B5F64; font-weight: 700">
<span>{{name}}</span><span style="color: #15171A">{{total}}</span>
</div>
<sc-for list="{{subs}}" as="s" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #EFEDE7">
<span style="{{s.badgeStyle}}">{{s.pct}}</span>
<span style="{{s.nameStyle}}">{{s.name}}</span>
<span style="{{s.amountStyle}}">{{s.amount}}</span>
</div>
</sc-for>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"category":{"editor":"enum","options":["home","groceries","dining","transport","phone","shopping","health","fun","other"],"default":"home"},"onBack":{"editor":null},"$preview":{"width":390,"height":1220}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: props.category || 'home', m: 5 };
}
renderVals() {
var cad = function (n) { return (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
var months = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];
var full = ['April', 'May', 'June', 'July', 'August', 'September'];
// Each subcategory: [name, September amount, fixed each month?]. Other months keep fixed items and scale the rest to the month's total.
var DATA = {
home: { name: 'Home expenses', budget: 4400, series: [4517.95, 4173.58, 4417.82, 4684.73, 4415.21, 4283.49],
subs: [['Mortgage', 3280.92, 1], ['Property tax', 683.24, 1], ['Hydro One electricity', 149.65, 0], ['Home insurance', 120.99, 1], ['Enbridge gas', 48.69, 0], ['Internet', 0, 0], ['Water', 0, 0], ['Water heater', 0, 0]] },
groceries: { name: 'Groceries', budget: 1200, series: [1084.20, 1152.75, 1098.60, 1211.35, 1176.90, 1126.40],
subs: [['Costco', 486.25, 0], ['No Frills', 402.30, 0], ['Farm Boy', 237.85, 0]] },
dining: { name: 'Dining out', budget: 350, series: [298.40, 356.10, 402.75, 468.20, 385.60, 412.85],
subs: [['Restaurants', 268.40, 0], ['Takeout & delivery', 80.25, 0], ['Coffee', 64.20, 0]] },
transport: { name: 'Transportation', budget: 750, series: [642.10, 705.85, 731.40, 812.95, 684.20, 698.30],
subs: [['Car insurance', 214.50, 1], ['Parking & maintenance', 201.50, 0], ['Fuel', 186.30, 0], ['Presto transit', 96.00, 1]] },
phone: { name: 'Phone & subscriptions', budget: 200, series: [182.44, 182.44, 187.44, 187.44, 187.44, 187.44],
subs: [['Mobile phones', 130.00, 1], ['Streaming & apps', 57.44, 0]] },
shopping: { name: 'Shopping', budget: 400, series: [512.30, 288.45, 421.90, 604.15, 377.80, 356.20],
subs: [['Clothing', 164.80, 0], ['Household', 121.45, 0], ['Amazon', 69.95, 0]] },
health: { name: 'Health & personal care', budget: 150, series: [146.20, 62.35, 118.90, 88.45, 132.10, 94.60],
subs: [['Personal care', 52.45, 0], ['Pharmacy', 42.15, 0]] },
fun: { name: 'Entertainment', budget: 150, series: [96.40, 142.80, 188.25, 214.60, 110.35, 128.75],
subs: [['Movies & events', 76.50, 0], ['Hobbies', 52.25, 0]] },
other: { name: 'Other', budget: 100, series: [45.00, 120.50, 38.75, 86.20, 54.30, 62.00],
subs: [['Gifts', 40.00, 0], ['Miscellaneous', 22.00, 0]] }
};
var order = ['home', 'groceries', 'dining', 'transport', 'phone', 'shopping', 'health', 'fun', 'other'];
var short = { home: 'Home', groceries: 'Groceries', dining: 'Dining', transport: 'Transport', phone: 'Phone', shopping: 'Shopping', health: 'Health', fun: 'Fun', other: 'Other' };
var key = DATA[this.state.cat] ? this.state.cat : 'home';
var d = DATA[key], m = this.state.m, s = d.series;
var total = s[m];

var fixed = 0, variable = 0;
d.subs.forEach(function (x) { if (x[2]) fixed += x[1]; else variable += x[1]; });
var factor = variable ? (total - fixed) / variable : 0;
var subs = d.subs.map(function (x) { return [x[0], x[2] ? x[1] : Math.round(x[1] * factor * 100) / 100]; });
var drift = Math.round((total - subs.reduce(function (a, x) { return a + x[1]; }, 0)) * 100) / 100;
for (var i = 0; i < subs.length; i++) { if (!d.subs[i][2] && subs[i][1] > 0) { subs[i][1] = Math.round((subs[i][1] + drift) * 100) / 100; break; } }
subs.sort(function (a, b) { return b[1] - a[1]; });

var avg = s.reduce(function (a, v) { return a + v; }, 0) / s.length;
var max = Math.max.apply(null, s) * 1.18;
var plot = 180;
var diffStyle = function (v) { return 'font-size: 14px; font-weight: 700; color: ' + (v > 0 ? '#8F3312' : '#1C7147'); };
var sign = function (v) { return (v > 0 ? '+' : '') + cad(v); };
var prevDelta = m > 0 ? total - s[m - 1] : 0;
var left = d.budget - total;

return {
embedded: !!this.props.onBack,
standalone: !this.props.onBack,
back: () => this.props.onBack && this.props.onBack(),
name: d.name,
chips: order.map((k) => ({
label: short[k], on: k === key,
pick: () => this.setState({ cat: k }),
style: 'flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 18px; font: 700 13px Manrope, sans-serif; ' + (k === key ? 'border: 1px solid #15171A; background: #15171A; color: #FFFFFF' : 'border: 1px solid #E3E0D8; background: #FFFFFF; color: #15171A')
})),
monthLabel: full[m] + ' 2026',
monthShort: months[m],
prevShort: m > 0 ? months[m - 1] : 'Mar',
atStart: m === 0, atEnd: m === 5,
prev: () => this.setState({ m: Math.max(0, m - 1) }),
next: () => this.setState({ m: Math.min(5, m + 1) }),
bars: s.map((v, i) => ({
month: months[i], on: i === m,
short: '$' + (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v)),
aria: full[i] + ' 2026: ' + cad(v),
pick: () => this.setState({ m: i }),
labelStyle: 'font-size: 11px; font-weight: 700; color: ' + (i === m ? '#15171A' : '#5B5F64'),
barStyle: 'display: block; width: 100%; max-width: 36px; height: ' + Math.max(2, Math.round(v / max * plot)) + 'px; border-radius: 4px 4px 0 0; background: ' + (i === m ? '#16427F' : '#6E9AD6'),
monthStyle: 'text-align: center; font-size: 12px; ' + (i === m ? 'font-weight: 700; color: #15171A' : 'font-weight: 600; color: #5B5F64')
})),
avg: cad(avg),
avgLineStyle: 'position: absolute; left: 0; right: 0; bottom: ' + Math.round(avg / max * plot) + 'px; border-top: 1.5px dashed #8C877C',
total: cad(total),
delta: m > 0 ? sign(prevDelta) : '—',
deltaPct: m > 0 ? (prevDelta >= 0 ? '+' : '−') + Math.abs(prevDelta / s[m - 1] * 100).toFixed(1) + '%' : 'no earlier data',
deltaStyle: diffStyle(prevDelta),
avgDelta: sign(total - avg),
avgDeltaStyle: diffStyle(total - avg),
isCurrent: m === 5,
budget: cad(d.budget),
budgetLeft: left >= 0 ? cad(left) + ' left' : cad(-left) + ' over',
budgetStyle: 'font-weight: 700; color: ' + (left >= 0 ? '#1C7147' : '#8F3312'),
subs: subs.map(function (x) {
var pct = total ? Math.round(x[1] / total * 100) : 0;
var zero = x[1] === 0;
return {
name: x[0], amount: cad(x[1]), pct: pct + '%',
badgeStyle: 'min-width: 48px; box-sizing: border-box; text-align: center; padding: 4px 0; border-radius: 8px; font-size: 13px; font-weight: 700; ' + (zero ? 'background: #F1EFEA; color: #6B6F74' : 'background: #E4EDF8; color: #154A8C'),
nameStyle: 'flex-grow: 1; font-size: 15px; font-weight: 600; color: ' + (zero ? '#6B6F74' : '#15171A'),
amountStyle: 'font-size: 15px; font-weight: 700; color: ' + (zero ? '#6B6F74' : '#15171A')
};
})
};
}
}
</script>
</body>
</html>
